  // 生日檢查：回傳 { insuranceAge, actualAge } 或 null（未填完／日期不存在）
  function csAge() {
    const y = Number(cs.birthY), m = Number(cs.birthM), d = Number(cs.birthD);
    if (!cs.birthY || !cs.birthM || !cs.birthD) return null;
    if (!(y >= 1 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return { invalid: true };
    const dt = new Date(y + 1911, m - 1, d);
    if (dt.getMonth() !== m - 1 || dt.getDate() !== d) return { invalid: true };
    const r = calcInsuranceAndActualAge(y, m, d, new Date());
    return r || { invalid: true };
  }

  // 投保年齡下限以「足歲」判斷、上限以「保險年齡」判斷（與官方 Excel 投保年齡區間一致）
  function csTermAllowed(t, age) {
    return age.actualAge >= t.ageMin && age.insuranceAge <= t.ageMax;
  }

  function csRefresh() {
    const p = csProduct();
    const $ = id => document.getElementById(id);
    const age = csAge();
    const ageOk = age && !age.invalid;

    // 生日提示
    const ageEl = $('cs-age');
    if (!age) { ageEl.textContent = ''; ageEl.className = 'cs-age'; }
    else if (age.invalid) { ageEl.textContent = '請確認生日是否正確'; ageEl.className = 'cs-age warn'; }
    else { ageEl.textContent = `保險年齡 ${age.insuranceAge} 歲　實際年齡 ${age.actualAge} 歲`; ageEl.className = 'cs-age'; }

    // 年期卡片
    $('cs-terms').querySelectorAll('.cs-term').forEach(btn => {
      const t = p.terms.find(x => x.term === Number(btn.dataset.term));
      btn.classList.toggle('active', cs.term === t.term);
      btn.classList.toggle('off', !!(ageOk && !csTermAllowed(t, age)));
    });

    // 保額
    const faceOk = cs.face !== null && cs.face >= p.faceMin && cs.face <= p.faceMax;
    const range = $('cs-range');
    const sliderVal = cs.face === null ? p.faceMin : Math.min(p.faceMax, Math.max(p.faceMin, cs.face));
    range.value = sliderVal;
    range.style.setProperty('--p', cs.face === null ? '0%' : `${(sliderVal - p.faceMin) / (p.faceMax - p.faceMin) * 100}%`);
    $('cs-face-note').textContent = (cs.face !== null && !faceOk) ? `保額範圍：${p.faceMin} ~ ${p.faceMax} 萬` : '';
    $('cs-est-l').textContent = `${cs.freq}保費預估`;

    const checks = [ageOk, !!cs.term, faceOk];
    const termObj = p.terms.find(t => t.term === cs.term);

    if (!checks.every(Boolean)) { csPanelIdle(checks); return; }
    if (!csTermAllowed(termObj, age)) {
      csPanelIdle(checks, `保險年齡 ${age.insuranceAge} 歲（足歲 ${age.actualAge} 歲）不在 ${termObj.term} 年期的投保範圍（${termObj.ageMin}～${termObj.ageMax} 歲），請改選其他年期。`);
      return;
    }

    const payload = {
      name: cs.name || '客戶',
      birth_year: Number(cs.birthY), birth_month: Number(cs.birthM), birth_day: Number(cs.birthD),
      payment_term: cs.term, payment_freq: cs.freq, face_amount_wan: cs.face,
      first_payment_method: cs.firstPay, renewal_payment_method: cs.renewPay, discount: cs.discount,
    };
    const key = p.apiProduct + JSON.stringify(payload);
    if (key === cs.lastKey) return;   // 與上次相同，不重算
    cs.lastKey = key;
    clearTimeout(cs.timer);
    cs.reqSeq++;                      // 讓還在路上的舊結果作廢
    csPanelLoading();
    cs.timer = setTimeout(() => csCalculate(p, payload, key), 600);
  }

  function csPanelIdle(checks, warning) {
    cs.lastKey = null;
    cs.reqSeq++;
    clearTimeout(cs.timer);
    document.getElementById('cs-est').textContent = '—';
    document.getElementById('cs-table-card').style.display = 'none';
    document.getElementById('cs-benefit-card').style.display = 'none';
    const items = ['填寫出生年月日', '選擇繳費年期', '設定規劃保額'];
    const panel = document.getElementById('cs-panel');
    panel.className = 'cs-panel';
    panel.innerHTML = `
      <div class="cs-icon">${warning ? '⚠️' : '📋'}</div>
      <h3>${warning ? '無法試算' : '即時試算保費'}</h3>
      <div class="hint ${warning ? 'err' : ''}">${warning || '完成左方三項資料<br>結果將自動顯示於此'}</div>
      <div class="cs-check">
        ${items.map((t, i) => `<div class="${checks[i] ? 'done' : ''}"><i>${checks[i] ? '✓' : ''}</i>${t}</div>`).join('')}
      </div>`;
  }

  function csPanelLoading() {
    document.getElementById('cs-est').textContent = '…';
    const panel = document.getElementById('cs-panel');
    panel.className = 'cs-panel';
    panel.innerHTML = `
      <div class="cs-spinner"></div>
      <h3>試算中…</h3>
      <div class="hint">正在用官方 Excel 建議書重新計算<br>閒置後第一次試算可能需要 15～30 秒</div>`;
  }

  async function csCalculate(product, payload, key) {
    const seq = ++cs.reqSeq;
    try {
      const resp = await fetch(`${CANCER_API_BASE}/api/${product.apiProduct}/calculate`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...payload, want_pdf: false, include_freq_table: true }),
      });
      const data = await resp.json();
      if (seq !== cs.reqSeq) return;
      if (!resp.ok) throw new Error(data.error || '試算失敗，請確認輸入內容');
      if (!data.premiums || !(data.premiums.annual_premium_gross > 0)) {
        throw new Error('輸入條件超出本商品承保範圍，請確認年齡、繳費年期與保額');
      }
      cs.lastData = data;
      csPanelResult(product, payload, data);
    } catch (err) {
      if (seq !== cs.reqSeq) return;
      cs.lastKey = null;   // 允許使用者不改資料直接重試
      const msg = err.message === 'Failed to fetch' ? '連不上試算服務，請稍後再試' : err.message;
      document.getElementById('cs-est').textContent = '—';
      const panel = document.getElementById('cs-panel');
      panel.className = 'cs-panel';
      panel.innerHTML = `
        <div class="cs-icon">⚠️</div>
        <h3>試算失敗</h3>
        <div class="hint err">${csEsc(msg)}</div>
        <button class="cs-pdf-btn" style="max-width:240px" onclick="cs.lastKey=null; csRefresh()">重新試算</button>`;
    }
  }

  // 金額（元）轉成「150 萬」這種顯示；不是整萬時保留小數（如 3.1 萬）
  function csWan(yuan) {
    const w = Math.round(yuan / 100) / 100;
    return `${w.toLocaleString('zh-TW', { maximumFractionDigits: 2 })} 萬`;
  }

  // 依商品給付規則組出「給付保障」清單。
  // 金額規則皆對照官方 Excel 投保利益表驗證：
  //   癌症（初期／輕度）保額 10%、癌症（重度）保額 100%，第 1 年改為年繳保費 ×1.06；
  //   特定癌症（重度）第 2～6 年起依序保額 10%～50%；特定傷病保額 10%；特定手術保額 2%；
  //   滿期／祝壽保險金 = 年繳保費 × 繳費年期 × 1.06。
  function csBenefits(p, face, annual, term, rows) {
    const F = face * 10000;
    const isCI = p.tableLayout === 'CI';
    const r1 = rows[0] || {}, r2 = rows[1] || {};
    // 首年：CIA/CIB 直接取年度明細首年金額；CLZ/CLX 依投保利益表公式 年繳保費 × 1.06
    const clY1 = annual ? Math.round(annual * 1.06) : null;
    const sevY1 = isCI ? r1.cancer_severe : clY1;
    const earlyY1 = isCI ? r1.cancer_early : clY1;
    const sevY2 = isCI && r2.cancer_severe ? r2.cancer_severe : F;
    const earlyY2 = isCI && r2.cancer_early ? r2.cancer_early : F * 0.1;
    const wait = isCI ? '等待期間（癌症 90 日）' : '等待期間（90 日）';
    const list = [
      { title: '首次罹患癌症（重度）保險金', hot: true,
        desc: `${wait}屆滿後首次確診｜第2年起按保險金額給付；曾領初期／輕度保險金者扣除後給付｜給付一次為限`,
        amount: `<small>第2年起</small> ${csWan(sevY2)}`, sub: sevY1 ? `首年為 ${fmtNum(sevY1)} 元` : '' },
      { title: '首次罹患癌症（初期・輕度）保險金',
        desc: `${wait}屆滿後首次確診｜給付一次為限；若已先或同時符合重度癌症則不另給付`,
        amount: `<small>第2年起</small> ${csWan(earlyY2)}`, sub: `保額 10%${earlyY1 ? `；首年為 ${fmtNum(earlyY1)} 元` : ''}` },
      { title: '首次罹患特定癌症（重度）保險金',
        desc: '第2保單年度起，重度癌症且屬特定癌症｜第2至第6年起依序給付保額 10%、20%、30%、40%、50%｜給付一次為限',
        chips: p.specificCancers || null,
        chipsNote: `${p.fixedGender}性專屬 ${p.specificCancers.length} 項（ICD-10-CM 編碼）`,
        amount: `${csWan(F * 0.1).replace(' 萬', '')}～${csWan(F * 0.5)}`, sub: '額外給付一次' },
      { title: '特定傷病保險金',
        desc: `${isCI ? '等待期間屆滿後' : '第2保單年度起'}經醫師診斷確定特定傷病之一（${p.specificDiseases}）｜給付一次為限`,
        amount: csWan(F * 0.1), sub: '保額 10%' },
      { title: '特定手術保險金',
        desc: '契約有效期間內接受特定手術｜同時或先後接受二項以上僅給付其中一項；同項手術以給付一次為限',
        list: p.specificSurgeries, listLabel: `查看 ${p.specificSurgeries.length} 項特定手術`,
        amount: csWan(F * 0.02), sub: '保額 2%' },
      { title: isCI ? '所繳保費退還、身故（喪葬費用）保險金' : '身故（喪葬費用）保險金',
        desc: `契約有效期間內身故，按當年度保險金額給付，扣除已領各項保險金${isCI ? '｜實際年齡滿15足歲前身故者，改為退還所繳保險費' : ''}`,
        amount: '依身故年度', sub: '詳下方年度明細' },
      { title: isCI ? '祝壽保險金' : '滿期保險金',
        desc: `被保險人保險年齡屆滿 ${p.endAge} 歲仍生存，按當年度保險金額給付後契約終止`,
        amount: annual ? `${fmtNum(annual * term * 1.06)} 元` : '—', sub: '年繳保費總和 ×1.06，扣除已領' },
      { title: '豁免保險費',
        desc: '繳費期間內確診重度癌症，或意外事故致 1～6 級失能',
        amount: '豁免', sub: '診斷確定日後續期保費' },
    ];
    return list;
  }

  function csPanelResult(product, payload, data) {
    const pr = data.premiums || {};
    const age = csAge();
    const insAge = age && !age.invalid ? age.insuranceAge : null;
    const freq = payload.payment_freq;
    const term = payload.payment_term;
    const face = pr.final_face_amount_wan || payload.face_amount_wan;
    const byFreq = pr.by_freq || null;
    const annual = byFreq ? byFreq['年繳'].gross : (freq === '年繳' ? pr.annual_premium_gross : null);
    const rows = (data.tables && data.tables.main && data.tables.main.rows) || [];
    const isCI = product.tableLayout === 'CI';
    document.getElementById('cs-est').textContent = fmtNum(pr.annual_premium_gross);
    const discounted = pr.first_period_premium < pr.annual_premium_gross;
    const rate = annual ? Math.round(annual / face * 100) / 100 : null;

    const freqTiles = byFreq ? `
      <div class="cs-r-sub">各繳費頻率對照</div>
      <div class="cs-freq">
        ${PAYMENT_FREQS.map(f => `
          <button class="cs-freq-tile ${f === freq ? 'active' : ''}" data-freq="${f}">
            <span class="l">${f}</span>
            <span class="v">${fmtNum(byFreq[f].gross)}</span>
            <span class="u">元 / ${f === '年繳' ? '年' : '期'}</span>
          </button>`).join('')}
      </div>` : '';

    const benefits = csBenefits(product, face, annual, term, rows);

    const panel = document.getElementById('cs-panel');
    panel.className = 'cs-panel result';
    panel.innerHTML = `
      <div class="cs-rcard cs-rcard-main">
        <div class="cs-r-who">
          <span class="g">${product.fixedGender === '男' ? '👨🏻' : '👩🏻'} ${product.fixedGender}性</span>
          <span>保險年齡 <b>${insAge ?? '—'}</b> 歲 · 規劃 <b>${fmtNum(face)}</b> 萬元</span>
        </div>
        <div class="cs-r-label">${freq}保費</div>
        <div class="cs-r-big"><span class="cur">$</span>${fmtNum(pr.annual_premium_gross)}</div>
        ${discounted ? `<div class="cs-r-net">每期實繳 ${fmtNum(pr.first_period_premium)} 元（已扣保費折扣）</div>` : ''}
        <div class="cs-r-pill">繳費 ${term} 年 · 保障至 ${product.endAge} 歲（${isCI ? '終身' : '定期'}）</div>
        ${freqTiles}
        <button class="cs-pdf-btn" id="cs-pdf-btn">📄 下載 PDF 建議書</button>
        <div class="cs-pdf-err" id="cs-pdf-err"></div>
      </div>

      <div class="cs-rcard">
        <div class="cs-r-title">保費明細 <span class="tag">${term} 年期</span></div>
        <div class="cs-stats">
          <div><span>費率（元／萬元保額）</span><b>${rate !== null ? rate.toLocaleString('zh-TW') : '—'}</b></div>
          <div><span>投保年齡</span><b>${insAge ?? '—'} 歲</b></div>
          <div><span>規劃保額</span><b>${fmtNum(face)} 萬</b></div>
          <div><span>繳費年期</span><b>${term} 年期</b></div>
        </div>
        <div class="cs-sum">
          <div class="row"><span>年繳保費</span><b>${annual ? fmtNum(annual) + ' 元' : '—'}</b></div>
          ${byFreq && byFreq['年繳'].first < annual ? `<div class="row"><span>年繳實繳保費（折扣後）</span><b>${fmtNum(byFreq['年繳'].first)} 元</b></div>` : ''}
          <div class="row"><span>預計繳費期滿保險年齡</span><b>${insAge !== null ? insAge + term : '—'} 歲</b></div>
          <div class="row total"><span>預估總保費（年繳）</span><b>${annual ? fmtNum(annual * term) : '—'} 元<sup>*</sup></b></div>
        </div>
        <div class="cs-foot">* 以年繳應繳保費 × 繳費年期估算，未扣除保費折扣；實際以保單條款及核保結果為準。</div>
      </div>
    `;
    panel.querySelectorAll('.cs-freq-tile').forEach(btn => btn.addEventListener('click', () => {
      if (btn.dataset.freq === cs.freq) return;
      cs.freq = btn.dataset.freq;
      document.getElementById('cs-freq').value = cs.freq;
      csRefresh();
    }));
    document.getElementById('cs-pdf-btn').addEventListener('click', () => csDownloadPdf(product, payload));

    // 給付保障（全寬卡片）
    document.getElementById('cs-benefit-card').innerHTML = `
      <div class="cs-r-title">${product.code} 給付保障 <span class="tag">${benefits.length} 項</span></div>
      <div class="cs-benefits">
        ${benefits.map((b, i) => `
          <div class="cs-bf ${b.hot ? 'hot' : ''}">
            <div class="n">${i + 1}</div>
            <div class="body">
              <div class="t">${b.title}</div>
              <div class="d">${b.desc}</div>
              ${b.chips ? `<div class="chips">${b.chips.map(c => `<span><b>${c.split(' ')[0]}</b> ${c.slice(c.indexOf(' ') + 1)}</span>`).join('')}</div>` : ''}
              ${b.chipsNote ? `<div class="cn">${b.chipsNote}</div>` : ''}
              ${b.list ? `<details class="lst"><summary>${b.listLabel}</summary><ol>${b.list.map(x => `<li>${x}</li>`).join('')}</ol></details>` : ''}
            </div>
            <div class="amt"><div class="a">${b.amount}</div>${b.sub ? `<div class="s">${b.sub}</div>` : ''}</div>
          </div>`).join('')}
      </div>
      <div class="cs-foot">各項保險金實際給付金額及條件以保單條款規定為準。</div>`;
    document.getElementById('cs-benefit-card').style.display = 'block';

    const columns = isCI ? CI_TABLE_COLUMNS : CANCER_TABLE_COLUMNS;
    const head = '<tr>' + columns.map(c => `<th>${c.label}</th>`).join('') + '</tr>';
    const body = rows.map(row => '<tr>' + columns.map(c => {
      const v = row[c.key];
      const txt = (c.key === 'policy_year' || c.key === 'age') ? (v === null || v === undefined ? '—' : Math.round(v)) : fmtNum(v);
      return `<td>${txt}</td>`;
    }).join('') + '</tr>').join('');
    document.getElementById('cs-table').innerHTML = head + body;
    document.getElementById('cs-table-card').style.display = 'block';
  }

  async function csDownloadPdf(product, payload) {
    const btn = document.getElementById('cs-pdf-btn');
    const errEl = document.getElementById('cs-pdf-err');
    btn.disabled = true;
    btn.textContent = '產生 PDF 中…';
    errEl.textContent = '';
    try {
      const resp = await fetch(`${CANCER_API_BASE}/api/${product.apiProduct}/calculate`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...payload, want_pdf: true }),
      });
      const data = await resp.json();
      if (!resp.ok || !data.pdf_base64) throw new Error(data.error || 'PDF 產生失敗');
      downloadPdfBlob(data.pdf_base64, `${product.code}建議書_${payload.name}.pdf`);
    } catch (err) {
      errEl.textContent = 'PDF 產生失敗：' + (err.message === 'Failed to fetch' ? '連不上試算服務，請稍後再試' : err.message);
    } finally {
      if (document.getElementById('cs-pdf-btn') === btn) {
        btn.disabled = false;
        btn.textContent = '📄 下載 PDF 建議書';
      }
    }
  }

  function initLTSAgeHint() {
    const yearEl = document.getElementById('lts-birth-year');
    const monthEl = document.getElementById('lts-birth-month');
    const dayEl = document.getElementById('lts-birth-day');
    const hintEl = document.getElementById('lts-age-hint');
    if (!yearEl || !monthEl || !dayEl || !hintEl) return;

    function update() {
      const y = yearEl.value, m = monthEl.value, d = dayEl.value;
      if (!y || !m || !d) {
        hintEl.style.display = 'none';
        return;
      }
      const result = calcInsuranceAndActualAge(y, m, d, new Date());
      if (!result) {
        hintEl.style.display = 'none';
        return;
      }
      hintEl.textContent = `保險年齡 ${result.insuranceAge} 歲　實際年齡 ${result.actualAge} 歲`;
      hintEl.style.display = 'block';
    }

    [yearEl, monthEl, dayEl].forEach(el => el.addEventListener('input', update));
  }

    { key: 'policy_year', label: '保單年度' },

  async function submitLTSCalc(product) {
    const errorEl = document.getElementById('lts-error');
    const loadingEl = document.getElementById('lts-loading');
    const resultBox = document.getElementById('lts-result-box');
    const btn = document.getElementById('lts-submit-btn');
    errorEl.style.display = 'none';
    resultBox.style.display = 'none';

    const birthYear = document.getElementById('lts-birth-year').value;
    const birthMonth = document.getElementById('lts-birth-month').value;
    const birthDay = document.getElementById('lts-birth-day').value;
    if (!birthYear || !birthMonth || !birthDay) {
      errorEl.textContent = '請填寫完整的生日（民國年／月／日）';
      errorEl.style.display = 'block';
      return;
    }

    const payload = {
      name: document.getElementById('lts-name').value || '客戶',
      gender: document.getElementById('lts-gender').value,
      birth_year: Number(birthYear),
      birth_month: Number(birthMonth),
      birth_day: Number(birthDay),
      payment_term: Number(document.getElementById('lts-payment-term').value),
      payment_freq: document.getElementById('lts-payment-freq').value,
      face_amount_wan: Number(document.getElementById('lts-face-amount').value),
      first_payment_method: document.getElementById('lts-first-payment-method').value,
      renewal_payment_method: document.getElementById('lts-renewal-payment-method').value,
      discount: document.getElementById('lts-discount').value,
      want_pdf: true,
    };

    btn.disabled = true;
    loadingEl.style.display = 'block';

    try {
      const resp = await fetch(`${LTS_API_BASE}/api/${product.apiProduct}/calculate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      if (!resp.ok) {
        throw new Error(data.error || '試算失敗，請確認輸入內容');
      }
      renderLTSResults(data);
    } catch (err) {
      errorEl.textContent = '試算失敗：' + err.message + '（若持續發生，可能是後端服務剛啟動需要暖機，請稍後再試一次）';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      loadingEl.style.display = 'none';
    }
  }

      if (!y || !m || !d) {
        hintEl.style.display = 'none';
        return;
      }
      const result = calcInsuranceAndActualAge(y, m, d, new Date());
      if (!result) {
        hintEl.style.display = 'none';
        return;
      }
      hintEl.textContent = `保險年齡 ${result.insuranceAge} 歲　實際年齡 ${result.actualAge} 歲`;

  async function submitLTQTCalc(product) {
    const errorEl = document.getElementById('ltqt-error');
    const loadingEl = document.getElementById('ltqt-loading');
    const resultBox = document.getElementById('ltqt-result-box');
    const btn = document.getElementById('ltqt-submit-btn');
    errorEl.style.display = 'none';
    resultBox.style.display = 'none';

    const birthYear = document.getElementById('ltqt-birth-year').value;
    const birthMonth = document.getElementById('ltqt-birth-month').value;
    const birthDay = document.getElementById('ltqt-birth-day').value;
    if (!birthYear || !birthMonth || !birthDay) {
      errorEl.textContent = '請填寫完整的生日（民國年／月／日）';
      errorEl.style.display = 'block';
      return;
    }

    const payload = {
      name: document.getElementById('ltqt-name').value || '客戶',
      gender: document.getElementById('ltqt-gender').value,
      birth_year: Number(birthYear),
      birth_month: Number(birthMonth),
      birth_day: Number(birthDay),
      payment_term: Number(document.getElementById('ltqt-payment-term').value),
      payment_freq: document.getElementById('ltqt-payment-freq').value,
      face_amount_wan: Number(document.getElementById('ltqt-face-amount').value),
      first_payment_method: document.getElementById('ltqt-first-payment-method').value,
      renewal_payment_method: document.getElementById('ltqt-renewal-payment-method').value,
      discount: document.getElementById('ltqt-discount').value,
      want_pdf: true,
    };

    btn.disabled = true;
    loadingEl.style.display = 'block';

    try {
      const resp = await fetch(`${LTQT_API_BASE}/api/${product.apiProduct}/calculate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      if (!resp.ok) {
        throw new Error(data.error || '試算失敗，請確認輸入內容');
      }
      renderLTQTResults(data);
    } catch (err) {
      errorEl.textContent = '試算失敗：' + err.message + '（若持續發生，可能是後端服務剛啟動需要暖機，請稍後再試一次）';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      loadingEl.style.display = 'none';
    }
  }

  function renderLTQTResults(data) {
    const summaryEl = document.getElementById('ltqt-summary-grid');
    const p = data.premiums || {};

      <div class="summary-tile"><div class="label">保額（萬元）</div><div class="value">${fmtNum(p.final_face_amount_wan)}</div></div>
      <div class="summary-tile"><div class="label">年繳保費</div><div class="value">${fmtNum(p.annual_premium_gross)}</div></div>
      <div class="summary-tile"><div class="label">首年實繳保費</div><div class="value">${fmtNum(p.first_year_premium)}</div></div>
      <div class="summary-tile"><div class="label">續年實繳保費</div><div class="value">${fmtNum(p.renewal_year_premium)}</div></div>
    `;

    const tableEl = document.getElementById('ltqt-result-table');
    const rows = (data.tables && data.tables.main && data.tables.main.rows) || [];
    const head = '<tr>' + LTQT_TABLE_COLUMNS.map(c => `<th>${c.label}</th>`).join('') + '</tr>';
    const body = rows.map(row =>
      '<tr>' + LTQT_TABLE_COLUMNS.map(c => `<td>${c.key === 'policy_year' || c.key === 'age' ? (row[c.key] === null || row[c.key] === undefined ? '—' : Math.round(row[c.key])) : fmtNum(row[c.key])}</td>`).join('') + '</tr>'
    ).join('');
    tableEl.innerHTML = head + body;

    const downloadBtn = document.getElementById('ltqt-download-btn');
    if (data.pdf_base64) {
      downloadBtn.style.display = 'block';
      downloadBtn.onclick = () => downloadPdfBlob(data.pdf_base64, '建議書.pdf');
    } else {
      downloadBtn.style.display = 'none';
    }

    document.getElementById('ltqt-result-box').style.display = 'block';
  }
