<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建議書系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #eef4fb 0%, #f7f9fc 40%, #f5f5f7 100%);
    color: #1d1d1f;
    min-height: 100vh;
  }
  .container { width: 90%; max-width: 900px; margin: 0 auto; padding: 2.5rem 1rem; }
  @media (max-width: 640px) {
    .container { padding: 1.5rem 1rem; }
  }

  /* ---------- 密碼鎖畫面 ---------- */
  #lock-screen {
    position: fixed; inset: 0; z-index: 999;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #eef4fb 0%, #f7f9fc 40%, #f5f5f7 100%);
  }
  .lock-card {
    background: #fff; border-radius: 22px; padding: 2.5rem 2rem;
    width: 90%; max-width: 340px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  .lock-icon {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 1.25rem;
    background: #eef6ff; display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .lock-card h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.4rem; letter-spacing: -0.01em; }
  .lock-card p { font-size: 13px; color: #86868b; margin-bottom: 1.5rem; }
  #password-input {
    width: 100%; font-size: 18px; font-weight: 600; text-align: center;
    letter-spacing: 4px; padding: 12px 14px; border-radius: 12px;
    border: 1.5px solid #e5e5ea; background: #f9f9fb; color: #1d1d1f;
    margin-bottom: 0.9rem; font-family: inherit;
  }
  #password-input:focus { outline: none; border-color: #0071e3; background: #fff; box-shadow: 0 0 0 4px rgba(0,113,227,0.08); }
  #unlock-btn {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: #0071e3; color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  #unlock-btn:hover { background: #0060c2; }
  #lock-error { color: #d0392b; font-size: 13px; margin-top: 0.7rem; min-height: 16px; }

  /* ---------- 共用元件 ---------- */
  .back-link {
    display: inline-flex; align-items: center; gap: 4px; margin-bottom: 16px;
    font-size: 14px; color: #0071e3; text-decoration: none; font-weight: 600;
    cursor: pointer; background: none; border: none; padding: 0; font-family: inherit;
  }
  h1.page-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
  .subtitle { font-size: 14px; color: #86868b; margin-bottom: 2rem; }

  /* ---------- 首頁：模組卡片 ---------- */
  .module-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;
  }
  @media (max-width: 560px) { .module-grid { grid-template-columns: 1fr; } }
  .module-card {
    background: #fff; border-radius: 18px; padding: 20px;
    display: flex; align-items: center; gap: 14px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.04); border: 1.5px solid transparent;
    transition: all .15s; text-align: left;
  }
  .module-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,0.08); border-color: #0071e3; }
  .module-icon {
    width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
    background: #eef6ff; display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .module-info { flex: 1; }
  .module-name { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
  .module-count { font-size: 12.5px; color: #86868b; }
  .module-arrow { color: #c7c7cc; font-size: 18px; }

  /* ---------- 模組內：商品列表 ---------- */
  .product-list { display: flex; flex-direction: column; gap: 10px; }
  .product-row {
    background: #fff; border-radius: 16px; padding: 16px 18px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    border: 1.5px solid transparent; transition: all .15s;
  }
  .product-row:hover { border-color: #0071e3; background: linear-gradient(135deg,#eef6ff,#f5faff); }
  .product-code { font-size: 15.5px; font-weight: 700; letter-spacing: 0.02em; }
  .product-status {
    font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  }
  .product-status.pending { background: #fdf1e6; color: #b56a1a; }
  .product-status.ready { background: #e7f7ee; color: #1a8a3c; }

  /* ---------- 商品詳細（試算 / 建議書產出） ---------- */
  .product-detail-card {
    background: #fff; border-radius: 18px; padding: 28px 24px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.04);
  }
  .product-detail-card .code-badge {
    display: inline-block; font-size: 13px; font-weight: 700; color: #0071e3;
    background: #eef6ff; padding: 4px 12px; border-radius: 999px; margin-bottom: 12px;
  }
  .product-detail-card h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
  .placeholder-box {
    margin-top: 1.2rem; padding: 22px; border-radius: 14px;
    background: #f9fafc; border: 1.5px dashed #d8dce3;
    color: #6e6e73; font-size: 14px; line-height: 1.7;
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ---------- 試算表單 ---------- */
  .form-section { margin-top: 1.4rem; }
  .form-section + .form-section { margin-top: 1.8rem; padding-top: 1.4rem; border-top: 1px solid #eee; }
  .form-section-title { font-size: 13px; font-weight: 700; color: #6e6e73; margin-bottom: 12px; letter-spacing: 0.02em; }
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: #444; }
  .field-note { font-size: 12.5px; color: #86868b; margin-top: 6px; }
  .age-hint {
    margin-top: 8px; padding: 8px 12px; border-radius: 10px;
    background: #eef6ff; color: #0071e3; font-size: 13px; font-weight: 600;
  }
  .field input[type="text"], .field input[type="number"], .field select {
    padding: 10px 12px; border-radius: 10px; border: 1.5px solid #e5e5ea;
    background: #f9f9fb; font-size: 14.5px; font-family: inherit; color: #1d1d1f;
  }
  .field input:focus, .field select:focus {
    outline: none; border-color: #0071e3; background: #fff; box-shadow: 0 0 0 3px rgba(0,113,227,0.08);
  }
  .birth-row { display: flex; gap: 8px; align-items: center; }
  .birth-row input { width: 100%; text-align: center; }
  .birth-row span { font-size: 13px; color: #86868b; flex-shrink: 0; }
  .radio-group { display: flex; gap: 10px; }
  .radio-pill {
    flex: 1; text-align: center; padding: 9px 10px; border-radius: 10px;
    border: 1.5px solid #e5e5ea; background: #f9f9fb; font-size: 14px; font-weight: 600;
    color: #444; cursor: pointer; transition: all .12s; user-select: none;
  }
  .radio-pill.active { background: #0071e3; border-color: #0071e3; color: #fff; }
  details.advanced { margin-top: 1.4rem; }
  details.advanced > summary {
    cursor: pointer; font-size: 13px; font-weight: 700; color: #0071e3; list-style: none;
  }
  details.advanced > summary::-webkit-details-marker { display: none; }
  details.advanced .form-grid { margin-top: 12px; }
  .submit-btn {
    margin-top: 1.6rem; width: 100%; padding: 13px; border: none; border-radius: 12px;
    background: #0071e3; color: #fff; font-size: 15.5px; font-weight: 700; cursor: pointer;
    transition: background .15s;
  }
  .submit-btn:hover { background: #0060c2; }
  .submit-btn:disabled { background: #b9d7f5; cursor: not-allowed; }
  .calc-error {
    margin-top: 1rem; padding: 12px 14px; border-radius: 10px;
    background: #fdeeec; color: #b3261e; font-size: 13.5px; display: none;
  }
  .calc-loading {
    margin-top: 1.4rem; text-align: center; color: #86868b; font-size: 13.5px; display: none;
  }

  /* ---------- 試算結果 ---------- */
  .result-box { margin-top: 1.8rem; padding-top: 1.6rem; border-top: 1px solid #eee; display: none; }
  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1.4rem; }
  @media (max-width: 560px) { .summary-grid { grid-template-columns: 1fr; } }
  .pfa-single-row { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .pfa-single-row .cell { text-align: center; padding: 18px 12px; border-radius: 16px; background: #eef3fc; border: 1px solid #d9e3f7; }
  .pfa-single-row .cell.twd { background: #e3ecfb; border-color: #c7d6f3; }
  .pfa-single-row .label { font-size: 13px; font-weight: 700; color: #5b6b8a; letter-spacing: 0.04em; }
  .pfa-single-row .value { margin-top: 8px; font-size: 26px; font-weight: 800; color: #1e3a8a; white-space: nowrap; }
  .pfa-single-row .value small { font-size: 14px; font-weight: 700; color: #3a4a6b; }
  .pfa-single-row .note { margin-top: 6px; font-size: 12px; color: #6b7a96; }
  .pfa-tools { margin-left: auto; display: inline-flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .pfa-currency-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px;
    border: 1.5px solid #c7d6f3; background: #eef3fc; color: #1e3a8a; font-size: 13.5px; font-weight: 800;
    font-family: inherit; cursor: pointer; transition: all .15s;
  }
  .pfa-currency-btn small { font-size: 11.5px; font-weight: 600; color: #5b6b8a; }
  .pfa-currency-btn:hover { border-color: #1e3a8a; }
  .pfa-currency-btn.active { background: #1e3a8a; border-color: #1e3a8a; color: #fff; }
  #pfa-result-table th small { font-size: 11px; font-weight: 600; color: #8a93a3; }
  #pfa-result-table { font-size: 13.5px; }
  #pfa-result-table th, #pfa-result-table td { padding: 8px 6px; }
  #pfa-result-table th { font-size: 13px; }
  #pfa-result-table th small { white-space: nowrap; font-size: 10.5px; }
  #pfa-result-table .ratio { background: #f3f7fe; }
  #pfa-result-table th.ratio { background: #e8effc; color: #1e3a8a; }
  #pfa-result-table td.ratio { font-weight: 700; color: #1e3a8a; }
  #pfa-result-table td.ratio.pos { color: #157a3a; }
  #pfa-result-table td.ratio.neg { color: #c0392b; }
  .pfa-ratio-note { margin-top: 8px; font-size: 12px; line-height: 1.6; color: #7b8494; }
  /* ---------- 保額型分紅：比較商品 ---------- */
  .pfa-compare-btn { background: #fff; }
  .pfa-compare { margin-top: 22px; padding: 22px 20px; border-radius: 20px; background: #f6f9fe; border: 1.5px solid #d9e3f7; }
  .pc-head { display: flex; justify-content: space-between; align-items: center; }
  .pc-title { font-size: 18px; font-weight: 800; color: #1e3a8a; }
  .pc-close { border: none; background: #e3ecfb; color: #1e3a8a; width: 32px; height: 32px; border-radius: 50%; font-size: 14px; cursor: pointer; }
  .pc-label { margin: 16px 0 8px; font-size: 13px; font-weight: 700; color: #5b6475; }
  .pc-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .pc-chip { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 104px; padding: 9px 12px; border-radius: 14px; border: 1.5px solid #d9e3f7; background: #fff; cursor: pointer; font-family: inherit; color: #2b3242; transition: all .15s; }
  .pc-chip b { font-size: 15px; font-weight: 800; }
  .pc-chip small { font-size: 11px; color: #7b8494; }
  .pc-chip.on { background: #1e3a8a; border-color: #1e3a8a; color: #fff; }
  .pc-chip.on small { color: #d6e0f7; }
  .pc-basis { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: center; }
  .pc-basis .radio-group { min-width: 0; }
  .pc-basis .radio-pill { min-width: 0; white-space: nowrap; }
  .pfa-compare { min-width: 0; }
  .pc-result-head, .pc-table-wrap { max-width: 100%; }
  .pc-basis .radio-pill.active { background: #1e3a8a; border-color: #1e3a8a; }
  .pc-value { display: flex; align-items: center; gap: 10px; }
  .pc-value input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #d9e3f7; background: #fff; font-size: 16px; font-weight: 700; font-family: inherit; }
  .pc-value span { font-size: 13px; font-weight: 700; color: #5b6475; white-space: nowrap; }
  .pc-note { margin-top: 8px; font-size: 12px; line-height: 1.6; color: #7b8494; }
  .pc-run { margin-top: 16px; width: 100%; padding: 12px; border: none; border-radius: 12px; background: #1e3a8a; color: #fff; font-size: 15px; font-weight: 800; font-family: inherit; cursor: pointer; }
  .pc-run:disabled { opacity: .6; cursor: wait; }
  .pc-err { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: #fdeeec; color: #b3261e; font-size: 13.5px; }
  .pc-loading { margin-top: 18px; display: flex; align-items: center; gap: 12px; font-size: 13.5px; color: #5b6475; }
  .pc-loading .cs-spinner { width: 26px; height: 26px; border-width: 3px; border-color: #d6e3fa; border-top-color: #1e3a8a; }
  .pc-result-head { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pc-client { font-size: 13.5px; font-weight: 700; color: #1d2433; }
  .pc-scen { margin-top: 12px; }
  .pc-table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid #e3e9f3; background: #fff; }
  .pc-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .pc-table th, .pc-table td { padding: 10px 12px; border-bottom: 1px solid #eef1f6; text-align: center; vertical-align: middle; }
  .pc-table tr > th:first-child { position: sticky; left: 0; z-index: 1; background: #f8fafd; text-align: left; font-size: 13px; font-weight: 700; color: #3a4150; white-space: nowrap; min-width: 108px; }
  .pc-table th small, .pc-table td small { font-size: 11px; font-weight: 600; color: #8a93a3; }
  .pc-table td { font-weight: 700; color: #1d2433; white-space: nowrap; }
  .pc-colhead { background: #eef3fc; min-width: 130px; }
  .pc-colhead .code { font-size: 17px; font-weight: 800; color: #1e3a8a; }
  .pc-colhead .nm { font-size: 11px; font-weight: 600; color: #5b6475; white-space: nowrap; }
  .pc-colhead .ty { margin-top: 2px; font-size: 11.5px; font-weight: 700; color: #2554e0; }
  .pc-table td.best { background: #e3f4e9; color: #126b34; }
  .pc-table td.best small { color: #2f8a50; }
  .pc-table td.na { color: #b3261e; font-weight: 600; white-space: normal; }
  .pc-table tr.pc-grp > * { border-top: 2px solid #d9e3f7; }
  .pc-table .grp { display: block; font-size: 11.5px; font-weight: 800; color: #2554e0; }
  .pc-table tr.pc-key td { font-size: 15px; }
  .pc-foot { margin-top: 10px; font-size: 12px; line-height: 1.6; color: #8a93a3; }
  @media (max-width: 560px) {
    .pc-basis { grid-template-columns: minmax(0, 1fr); }
    .pfa-compare { padding: 18px 14px; }
    .pc-chip { min-width: calc(50% - 4px); }
    .pfa-tools { margin-left: 0; width: 100%; justify-content: flex-start; }
  }
  .summary-tile { background: #f9fafc; border-radius: 12px; padding: 12px 14px; }
  .summary-tile .label { font-size: 12px; color: #86868b; margin-bottom: 4px; }
  .summary-tile .value { font-size: 17px; font-weight: 700; color: #1d1d1f; }
  .scenario-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .scenario-tab {
    padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: #f0f0f2; color: #555; cursor: pointer; border: none; font-family: inherit;
  }
  .scenario-tab.active { background: #0071e3; color: #fff; }
  .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid #eee; max-height: 420px; overflow-y: auto; }
  table.result-table { width: 100%; border-collapse: collapse; font-size: 15px; white-space: nowrap; }
  table.result-table th {
    position: sticky; top: 0; background: #f5f5f7; padding: 9px 12px; text-align: right;
    font-weight: 700; color: #444; border-bottom: 1px solid #e5e5ea;
  }
  table.result-table th:first-child, table.result-table td:first-child { text-align: center; padding-right: 6px; }
  table.result-table th:nth-child(2), table.result-table td:nth-child(2) { text-align: center; padding-left: 6px; }
  table.result-table td { padding: 8px 12px; text-align: right; border-bottom: 1px solid #f2f2f4; }
  table.result-table tr:nth-child(even) { background: #fafafc; }
  .download-pdf-btn {
    margin-top: 1.2rem; width: 100%; padding: 12px; border-radius: 12px;
    background: #1a8a3c; color: #fff; font-size: 15px; font-weight: 700; border: none;
    cursor: pointer; transition: background .15s;
  }
  .download-pdf-btn:hover { background: #157030; }
  .download-pdf-btn:disabled { background: #a8d4b8; cursor: not-allowed; }

  /* ---------- 男女防癌險：商品試算工作台（CLZ / CLX / CIA / CIB） ---------- */
  #view-cancer .back-link { margin-bottom: 18px; color: var(--cs-accent); }
  /* 配色：預設藍色；女性商品（CLX / CIB）於 #view-cancer 加上 .cs-female 改為珊瑚蜜桃色 */
  #view-cancer, #view-dividend {
    --cs-accent: #2554e0;
    --cs-deep: #1e3a8a;
    --cs-tint: #eef3fc;
    --cs-tint-bd: #d9e3f7;
    --cs-track: #d6e3fa;
    --cs-hover-bd: #b7c8ef;
    --cs-input: #f4f7fc;
    --cs-input-bd: #e3e9f3;
    --cs-tab-hover: #f3f6fc;
    --cs-check: #f8fafd;
    --cs-line: #d6dfee;
    --cs-accent-rgb: 37,84,224;
    --cs-glow-rgb: 30,64,175;
    --cs-shadow-rgb: 30,58,138;
  }
  #view-cancer.cs-female {
    --cs-accent: #ee7b6b;
    --cs-deep: #c04a3c;
    --cs-tint: #fef3f0;
    --cs-tint-bd: #fbd9d1;
    --cs-track: #fcdcd5;
    --cs-hover-bd: #f6b8ab;
    --cs-input: #fff8f6;
    --cs-input-bd: #f6e1dc;
    --cs-tab-hover: #fff4f1;
    --cs-check: #fffaf8;
    --cs-line: #f3d5cd;
    --cs-accent-rgb: 238,123,107;
    --cs-glow-rgb: 192,74,60;
    --cs-shadow-rgb: 140,60,45;
  }
  .cs-tabs {
    display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 6px;
    max-width: 720px; margin: 0 auto 30px; padding: 8px;
    background: #fff; border-radius: 22px; border: 1px solid #eef1f6;
    box-shadow: 0 8px 28px rgba(var(--cs-shadow-rgb),0.08);
  }
  .cs-tab {
    border: none; background: transparent; border-radius: 16px; padding: 12px 6px;
    cursor: pointer; font-family: inherit; transition: background .15s, box-shadow .15s;
  }
  .cs-tab:hover { background: var(--cs-tab-hover); }
  .cs-tab .code { display: block; font-family: 'Montserrat', -apple-system, sans-serif; font-weight: 800; font-size: 20px; color: #2b3242; letter-spacing: 0.01em; }
  .cs-tab .sub { display: block; margin-top: 3px; font-size: 12px; color: #7b8494; white-space: nowrap; }
  .cs-tab.active { background: linear-gradient(135deg, var(--cs-accent) 0%, var(--cs-deep) 100%); box-shadow: 0 8px 18px rgba(var(--cs-glow-rgb),0.32); }
  .cs-tab.active .code, .cs-tab.active .sub { color: #fff; }

  .cs-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 24px; }
  .cs-code { font-family: 'Montserrat', -apple-system, sans-serif; font-weight: 800; font-size: 58px; line-height: 1; color: var(--cs-deep); letter-spacing: -0.01em; }
  .cs-desc { margin-top: 12px; font-size: 13.5px; color: #7b8494; }
  .cs-pill { flex-shrink: 0; font-size: 17px; font-weight: 800; letter-spacing: 0.04em; color: var(--cs-deep); background: var(--cs-tint); border: 1.5px solid var(--cs-tint-bd); padding: 12px 26px; border-radius: 999px; }

  .cs-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 22px; align-items: start; }

  .cs-gender { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 10px 18px; border-radius: 14px; background: var(--cs-tint); border: 1px solid var(--cs-tint-bd); color: var(--cs-deep); font-size: 15px; font-weight: 700; }

  .cs-face { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }

  .cs-est { text-align: right; }

  .cs-range {

  }

    -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%;

  }

  .cs-ticks { position: relative; height: 18px; margin: 0 14px; font-size: 12.5px; color: #7b8494; }
  .cs-ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }

  details.cs-adv { margin-top: 24px; border-top: 1px solid #e7ebf2; padding-top: 16px; }

  .cs-panel {
    position: sticky; top: 20px; min-height: 440px; padding: 40px 28px;

  }
  .cs-panel.result { border: 1px solid #e7ebf2; box-shadow: 0 10px 30px rgba(var(--cs-shadow-rgb),0.06); align-items: stretch; justify-content: flex-start; text-align: left; padding: 28px 26px; }
  .cs-icon { width: 78px; height: 78px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 34px; background: var(--cs-tint); border: 1px solid var(--cs-tint-bd); }

  .cs-check { width: 100%; max-width: 330px; margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
  .cs-check div { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-radius: 12px; border: 1px solid #e7ebf2; background: var(--cs-check); text-align: left; font-size: 15px; font-weight: 700; color: #2b3242; }
  .cs-check i { width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 2px solid #9aa3b2; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 12px; color: #fff; }
  .cs-check .done { color: var(--cs-deep); background: var(--cs-tint); border-color: var(--cs-tint-bd); }

  .cs-spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--cs-track); border-top-color: var(--cs-accent); animation: cs-spin .8s linear infinite; }

  .cs-res-tag { align-self: flex-start; font-size: 12.5px; font-weight: 700; color: var(--cs-deep); background: var(--cs-tint); padding: 5px 12px; border-radius: 999px; }

  .cs-res-rows { margin-top: 20px; border-top: 1px solid #eef1f6; }

  .cs-res-rows span { color: #6b7383; }
  .cs-res-rows b { font-weight: 700; color: #1d2433; }
  .cs-res-note { margin-top: 12px; font-size: 12.5px; color: #8a93a3; line-height: 1.6; }
  .cs-pdf-btn {
    margin-top: 20px; width: 100%; padding: 14px; border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, var(--cs-accent) 0%, var(--cs-deep) 100%); color: #fff; font-size: 15px; font-weight: 700; font-family: inherit;
    box-shadow: 0 8px 18px rgba(var(--cs-glow-rgb),0.25);

  .cs-pdf-btn:disabled { opacity: .6; cursor: wait; }

  .cs-table-card { margin-top: 22px; display: none; }
  .cs-table-card table.result-table th { white-space: normal; vertical-align: bottom; line-height: 1.35; min-width: 76px; }
  .cs-table-card table.result-table th:nth-child(-n+2) { white-space: nowrap; min-width: 0; }
  .cs-table-card h4 { margin-bottom: 14px; font-size: 15px; font-weight: 800; color: #1d2433; }


  /* ---- 試算結果（右側卡片 + 給付保障） ---- */
  .cs-panel.result { position: static; min-height: 0; padding: 0; border: none; background: transparent; box-shadow: none; display: flex; flex-direction: column; gap: 18px; align-items: stretch; text-align: left; }
  .cs-rcard { position: relative; overflow: hidden; background: #fff; border-radius: 24px; padding: 26px 24px; border: 1px solid var(--cs-tint); box-shadow: 0 10px 30px rgba(var(--cs-shadow-rgb),0.08); }
  .cs-rcard-main::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, var(--cs-accent), var(--cs-deep)); }

  .cs-r-label { margin-top: 20px; font-size: 13.5px; font-weight: 700; color: #8a93a3; }
  .cs-r-big { margin-top: 2px; font-family: 'Montserrat', -apple-system, sans-serif; font-weight: 800; font-size: 56px; line-height: 1.05; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--cs-deep), var(--cs-accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .cs-r-net { margin-top: 4px; font-size: 12.5px; color: #8a93a3; }
  .cs-r-pill { display: inline-block; margin-top: 12px; padding: 8px 16px; border-radius: 999px; background: var(--cs-tint); border: 1px solid var(--cs-tint-bd); color: var(--cs-deep); font-size: 13.5px; font-weight: 700; }
  .cs-r-sub { margin: 22px 0 10px; font-size: 13px; font-weight: 700; color: #8a93a3; letter-spacing: 0.04em; }
  .cs-freq { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cs-freq-tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 4px; border-radius: 14px; border: 1px solid var(--cs-tint-bd); background: var(--cs-check); cursor: pointer; font-family: inherit; transition: all .15s; }
  .cs-freq-tile:hover { border-color: var(--cs-hover-bd); }
  .cs-freq-tile .l { font-size: 12.5px; font-weight: 700; color: #8a93a3; }

  .cs-r-title { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 15px; font-weight: 800; color: #1d2433; }

  .cs-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

  .cs-sum { margin-top: 14px; padding: 8px 20px 14px; border-radius: 18px; background: var(--cs-input); }
  .cs-sum .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid #eef1f6; font-size: 14.5px; }
  .cs-sum .row span { font-weight: 600; color: #3a4150; }
  .cs-sum .row b { font-family: 'Montserrat', -apple-system, sans-serif; font-weight: 700; color: #1d2433; white-space: nowrap; }

  .cs-bf:last-child { border-bottom: none; }

  .cs-bf .n { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--cs-accent), var(--cs-deep)); }
  .cs-bf .t { font-size: 16px; font-weight: 800; color: #1d2433; }
  .cs-bf .d { margin-top: 6px; font-size: 13.5px; line-height: 1.65; color: #5b6475; }

  .cs-bf details.lst { margin-top: 10px; }

  .cs-bf .cn { margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--cs-accent); }
  .cs-bf .amt { text-align: right; min-width: 120px; }
  .cs-bf .a { font-family: 'Montserrat', -apple-system, sans-serif; font-size: 24px; font-weight: 800; color: var(--cs-deep); white-space: nowrap; }

  /* ---------- 保額型分紅：客戶資料 + 商品分頁 ---------- */
  #view-dividend .back-link { margin-bottom: 18px; color: var(--cs-accent); }

</style>

<body>

  <!-- ========== 密碼鎖畫面 ========== -->
  <div id="lock-screen">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>

      <input type="password" id="password-input" placeholder="●●●●" maxlength="20" autocomplete="off">
      <button id="unlock-btn">進入</button>
      <div id="lock-error"></div>
    </div>
  </div>

  <!-- ========== 主內容 ========== -->
  <div class="container" id="main-content" style="display:none;">

    <!-- 頂部品牌列 -->
    <div style="display:flex; align-items:center; justify-content:center; margin-bottom:1.5rem;">
      <img src="avatar.png" alt="頭像" style="width:112px; height:112px; border-radius:50%; object-fit:cover; flex-shrink:0; box-shadow:0 1px 4px rgba(0,0,0,0.15);">
    </div>

    <!-- 首頁：模組列表 -->
    <div class="view active" id="view-home">
      <h1 class="page-title" style="text-align:center;">建議書系統</h1>
      <div class="subtitle" style="text-align:center;">選擇商品分類，開始試算並產出建議書</div>
      <div class="module-grid" id="module-grid"></div>

    <!-- 模組內：商品列表 -->

      <div class="subtitle" id="module-subtitle"></div>
      <div class="product-list" id="product-list"></div>
    </div>

    <!-- 保額型分紅：上方客戶資料，下方商品分頁 -->

      <button class="back-link" onclick="showHome()">← 返回首頁</button>
      <div class="cs-card" id="dv-client">
        <div class="cs-sec first">客戶基本資料</div>
        <div class="dv-client-grid">
          <div class="dv-f"><label>被保險人姓名</label><input class="cs-input year" type="text" id="pfa-name" value="客戶"></div>
          <div class="dv-f"><label>性別</label>
            <div class="radio-group" data-target="pfa-gender">
              <div class="radio-pill active" data-value="女">女</div>

        <div id="dv-form"></div>
      </div>
    </div>

  // ---------- 密碼鎖 ----------
  function tryUnlock() {
    const input = document.getElementById('password-input');
    const errorEl = document.getElementById('lock-error');
    if (input.value === SITE_PASSWORD) {
      sessionStorage.setItem('proposalSystemUnlocked', '1');
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
    } else {
      errorEl.textContent = '密碼錯誤，請再試一次';
      input.value = '';
      input.focus();
    }
  }
  document.getElementById('unlock-btn').addEventListener('click', tryUnlock);
  document.getElementById('password-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryUnlock();
  });
  // 同一個瀏覽器分頁內，重新整理不用再輸入一次密碼
  if (sessionStorage.getItem('proposalSystemUnlocked') === '1') {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';

  // ---------- 畫面切換 ----------
  function switchView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  function showModule(index) {
    currentModuleIndex = index;
    const mod = MODULES[index];
    // 保額型分紅：不顯示商品列表，上方共用客戶資料、下方分頁切換商品
    if (mod.products.length && mod.products.every(p => p.calcType === 'PFA')) {
      const keep = dv.moduleIndex === index && dv.productIndex !== null;
      showDividendStudio(index, keep ? dv.productIndex : 0);
      return;
    }
    // 男女防癌險：不顯示商品列表，直接進入分頁式試算工作台
    // （回到這個分類時，停在上次看的商品）
    if (mod.products.length && mod.products.every(p => p.calcType === 'CANCER')) {
      const keep = cs.moduleIndex === index && cs.productIndex !== null;
      showCancerStudio(index, keep ? cs.productIndex : 0);
      return;
    }
    document.getElementById('module-title').textContent = mod.name;
    document.getElementById('module-subtitle').textContent = mod.products.length ? `共 ${mod.products.length} 項商品` : '商品建置中';
    const listEl = document.getElementById('product-list');
    listEl.innerHTML = mod.products.map((p, i) => `
      <div class="product-row" onclick="showProduct(${index}, ${i})">
        <span class="product-code">${p.code}${p.genderLabel ? ` <span style="font-weight:400;color:#86868b;">${p.genderLabel}</span>` : ''}</span>
        ${p.status === 'ready' ? '' : `<span class="product-status ${p.status}">尚未建置</span>`}
      </div>
    `).join('') || '<div class="placeholder-box">此分類的商品建置中。上傳商品的官方建議書 Excel 後，這裡會列出可試算的商品。</div>';
    switchView('view-module');
  }

  function showProduct(moduleIndex, productIndex) {
    currentModuleIndex = moduleIndex;
    const mod = MODULES[moduleIndex];
    const product = mod.products[productIndex];
    if (product.calcType === 'CANCER') {
      showCancerStudio(moduleIndex, productIndex);
      return;
    }
    document.getElementById('product-code-badge').textContent = product.code;
    document.getElementById('product-name-title').textContent = `${mod.name} — ${product.code}`;
    const contentEl = document.getElementById('product-content');

    if (product.calcType === 'PFA') {
      contentEl.innerHTML = renderPFAFormHTML(product);
      initRadioGroups(contentEl);
      document.getElementById('pfa-submit-btn').addEventListener('click', () => submitPFACalc(product));
    } else if (product.calcType === 'LTS') {
      contentEl.innerHTML = renderLTSFormHTML(product);
      initRadioGroups(contentEl);
      document.getElementById('lts-submit-btn').addEventListener('click', () => submitLTSCalc(product));
      initLTSAgeHint();
    } else if (product.calcType === 'LTQT') {
      contentEl.innerHTML = renderLTQTFormHTML(product);
      initRadioGroups(contentEl);
      document.getElementById('ltqt-submit-btn').addEventListener('click', () => submitLTQTCalc(product));
      initLTQTAgeHint();
    } else if (product.calcType === 'SD') {
      contentEl.innerHTML = renderSDFormHTML(product);
      initRadioGroups(contentEl);
      document.getElementById('sd-submit-btn').addEventListener('click', () => submitSDCalc(product));
      initSDAgeHint();
    } else {
      contentEl.innerHTML = `<div class="placeholder-box">${
        product.status === 'ready'
          ? '（此商品的試算功能建置中）'
          : '此商品的建議書格式尚未上傳。上傳格式後，這裡會提供客戶資料輸入欄位、保費／保額試算，並可一鍵產出 PDF 建議書。'
      }</div>`;
    }
    switchView('view-product');
  }

  function dvTypeLabel(p) {
    if (p.termOptions) return `${p.termOptions.join('/')} 年期`;
    if (p.mixedSingle) return `躉繳/${p.paymentTerm} 年期`;
    return (p.freqOptions || [])[0] === '躉繳' ? '躉繳' : `${p.paymentTerm} 年期`;
  }

  function showDividendStudio(moduleIndex, productIndex) {
    if (dv.moduleIndex !== moduleIndex) {
      // 換到另一個分類（保額型分紅 ↔ 利變型保單）：比較商品的選擇與結果不沿用
      pfaCompare.selected = null; pfaCompare.results = null; pfaCompare.order = [];
      dv.productIndex = null;
    }
    dv.moduleIndex = moduleIndex;
    currentModuleIndex = moduleIndex;
    if (!dv.inited) {
      initRadioGroups(document.getElementById('dv-client'));
      ['pfa-birth-year', 'pfa-birth-month', 'pfa-birth-day'].forEach(id =>
        document.getElementById(id).addEventListener('input', dvUpdateAge));
      dv.inited = true;
    }
    dv.productIndex = productIndex;
    renderDividendProduct();
    switchView('view-dividend');
  }

  function switchDividendProduct(productIndex) {
    if (productIndex === dv.productIndex) return;
    dv.productIndex = productIndex;
    renderDividendProduct();
  }

  function renderDividendProduct() {
    const mod = MODULES[dv.moduleIndex];
    const p = mod.products[dv.productIndex];
    document.getElementById('dv-tabs').style.setProperty('--n', mod.products.length);
    document.getElementById('dv-tabs').innerHTML = mod.products.map((x, i) => `
      <button class="cs-tab ${i === dv.productIndex ? 'active' : ''}" onclick="switchDividendProduct(${i})">
        <span class="code">${x.code}</span>
        <span class="sub"><span>${(x.fullName || '').slice(0, 4)}</span><span class="sep">・</span><span>${dvTypeLabel(x)}</span></span>
      </button>`).join('');
    document.getElementById('dv-code').textContent = p.code;
    document.getElementById('dv-desc').textContent =
      `富邦人壽${p.fullName || ''} · ${dvTypeLabel(p)} · 投保年齡 ${p.ageHint || '依商品規定'}`;
    const formEl = document.getElementById('dv-form');
    formEl.innerHTML = renderPFAFormHTML(p, { skipInsured: true });
    initRadioGroups(formEl);
    document.getElementById('pfa-submit-btn').addEventListener('click', () => submitPFACalc(p));
    document.getElementById('pfa-usd-rate').addEventListener('input', e => {
      const v = Number(e.target.value);
      if (v > 0) pfaRate.value = v;   // 手動修改的匯率在切換商品時沿用
      pfaUpdateConversion();
    });
    ['pfa-annual-twd', 'pfa-total-twd'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', () => { el.dataset.touched = '1'; pfaUpdateConversion(); });
    });
    const termEl = document.getElementById('pfa-term');
    if (termEl) termEl.addEventListener('change', () => pfaSyncTermUI(p));
    if (p.mixedSingle) {
      document.getElementById('pfa-payment-freq').addEventListener('change', () => pfaSyncTermUI(p));
      pfaSyncTermUI(p);   // 表單產生時欄位尚未在畫面上，產生後依實際繳別同步一次
    }
    pfaUpdateConversion();
    pfaLoadRate();
    dvUpdateAge();
  }

  function dvUpdateAge() {
    const el = document.getElementById('dv-age');
    const y = document.getElementById('pfa-birth-year').value;
    const m = document.getElementById('pfa-birth-month').value;
    const d = document.getElementById('pfa-birth-day').value;
    if (!y || !m || !d) { el.textContent = ''; el.className = 'cs-age'; return; }
    const r = calcInsuranceAndActualAge(y, m, d, new Date());
    if (!r) { el.textContent = '請確認生日是否正確'; el.className = 'cs-age warn'; return; }
    const p = MODULES[dv.moduleIndex].products[dv.productIndex];
    const max = p.ageMax ? p.ageMax[pfaTerm(p)] : Number(((p.ageHint || '').match(/～(\d+)/) || [])[1]);
    const over = max && r.insuranceAge > max;
    el.textContent = `保險年齡 ${r.insuranceAge} 歲　實際年齡 ${r.actualAge} 歲` + (over ? `　（超過 ${p.code} 投保年齡上限 ${max} 歲）` : '');
    el.className = over ? 'cs-age warn' : 'cs-age';
  }

  // ============================================================
  // 保額型分紅：比較商品
  // 以同一位客戶、相同總繳保費（台幣，依各商品繳費年期平均分攤；躉繳一次繳清）
  // 或相同保額，逐一呼叫後端用官方 Excel 試算，再並排比較解約金／身故保障等。
  // ============================================================
  const pfaCompare = {
    selected: null, basis: 'total', value: null, results: null, order: [],
    scenario: 'most_likely', running: false, rate: null, date: '', clientLabel: '',
  };
  const PC_YEARS = [5, 10, 15, 20, 30];

  function pcProducts() { return MODULES[dv.moduleIndex].products; }
  function pcCurrent() { return pcProducts()[dv.productIndex]; }
  function pcTypeLabel(p) { return pfaIsSingle(p) ? '躉繳' : `${p.paymentTerm} 年期`; }
  function pcVariants(p) {
    if (p.termOptions) return p.termOptions.map(t => ({ key: `${p.apiProduct}-${t}`, p, term: t, freq: '年繳', label: `${t} 年期` }));
    if (p.mixedSingle) return [
      { key: `${p.apiProduct}-1`, p, term: 1, freq: '躉繳', label: '躉繳' },
      { key: `${p.apiProduct}-${p.paymentTerm}`, p, term: p.paymentTerm, freq: '年繳', label: `${p.paymentTerm} 年期` },
    ];
    const single = (p.freqOptions || []).length === 1 && p.freqOptions[0] === '躉繳';
    return [{ key: p.apiProduct, p, term: p.paymentTerm, freq: single ? '躉繳' : '年繳', label: single ? '躉繳' : `${p.paymentTerm} 年期` }];
  }
  function pcAllVariants() { return pcProducts().flatMap(pcVariants); }
  function pcCurrentKey() {
    const p = pcCurrent();
    const vs = pcVariants(p);
    if (vs.length === 1) return vs[0].key;
    return `${p.apiProduct}-${pfaTerm(p)}`;
  }

  function pcPaidUsd(pr) {
    const term = pr.payment_term || 1;
    return pr.payment_freq === '躉繳' ? pr.first_year_premium : pr.first_year_premium + pr.renewal_year_premium * (term - 1);
  }

  function pcUpdateButton() {
    const btn = document.getElementById('pfa-compare-btn');
    const panel = document.getElementById('pfa-compare');
    if (btn && panel) btn.classList.toggle('active', panel.style.display !== 'none');
  }

  function pfaToggleCompare() {
    const panel = document.getElementById('pfa-compare');
    if (!panel) return;
    if (panel.style.display !== 'none') { panel.style.display = 'none'; pcUpdateButton(); return; }
    if (!pfaCompare.selected) pfaCompare.selected = new Set();
    pfaCompare.selected.add(pcCurrentKey());
    // 預設比較基準：目前這筆試算的總繳實繳保費（台幣萬元，取 1 位小數）
    if (pfaLastResult && pfaLastResult.premiums) {
      const pr = pfaLastResult.premiums;
      if (pfaLastCalc.rate > 0) {
        pfaCompare.basis = 'total';
        pfaCompare.value = Math.round(pcPaidUsd(pr) * pfaLastCalc.rate / 1000) / 10;
      } else {
        pfaCompare.basis = 'face';
        pfaCompare.value = pr.final_face_amount_wan;
      }
    }
    panel.style.display = 'block';
    pcRenderPanel();
    pcUpdateButton();
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function pcRenderPanel() {
    const panel = document.getElementById('pfa-compare');
    const variants = pcAllVariants();
    const isTotal = pfaCompare.basis === 'total';
    panel.innerHTML = `
      <div class="pc-head">
        <div class="pc-title">比較商品</div>
        <button class="pc-close" onclick="pfaToggleCompare()" aria-label="關閉">✕</button>
      </div>
      <div class="pc-label">選擇要比較的商品（可複選）</div>
      <div class="pc-chips">
        ${variants.map(v => `
          <button class="pc-chip ${pfaCompare.selected.has(v.key) ? 'on' : ''}" data-key="${v.key}">
            <b>${v.p.code}</b><small>${(v.p.fullName || '').slice(0, 4)}・${v.label}</small>
          </button>`).join('')}
      </div>
      <div class="pc-label">比較基準</div>
      <div class="pc-basis">
        <div class="radio-group">
          <div class="radio-pill ${isTotal ? 'active' : ''}" data-basis="total">相同總繳保費</div>
          <div class="radio-pill ${isTotal ? '' : 'active'}" data-basis="face">相同保額</div>
        </div>
        <div class="pc-value">
          <input type="number" id="pc-value" min="0" step="0.1" value="${pfaCompare.value ?? ''}">
          <span>${isTotal ? '萬元（台幣）' : '萬美元'}</span>
        </div>
      </div>
      <div class="pc-note">${isTotal
        ? `總繳保費依各商品繳費年期平均分攤（例：100 萬 → 6 年期每年約 16.7 萬、躉繳一次 100 萬），以 ${pfaRate.date ? pfaRate.date + ' ' : ''}匯率 ${pfaRate.value ?? '—'} 換算美元；保額由官方試算表換算。`
        : '各商品使用相同保額（萬美元）試算，保費依各商品費率不同。'}　繳別一律以年繳（躉繳商品為躉繳）比較。</div>
      <button class="pc-run" id="pc-run" ${pfaCompare.running ? 'disabled' : ''}>${pfaCompare.running ? '比較中…' : `開始比較（${pfaCompare.selected.size} 項商品）`}</button>
      <div id="pc-result"></div>
    `;
    panel.querySelectorAll('.pc-chip').forEach(chip => chip.addEventListener('click', () => {
      const key = chip.dataset.key;
      if (pfaCompare.selected.has(key)) pfaCompare.selected.delete(key); else pfaCompare.selected.add(key);
      chip.classList.toggle('on');
      const run = document.getElementById('pc-run');
      if (!pfaCompare.running) run.textContent = `開始比較（${pfaCompare.selected.size} 項商品）`;
    }));
    panel.querySelectorAll('.pc-basis .radio-pill').forEach(pill => pill.addEventListener('click', () => {
      if (pill.dataset.basis === pfaCompare.basis) return;
      pfaCompare.basis = pill.dataset.basis;
      pfaCompare.value = pfaCompare.basis === 'face'
        ? (pfaLastResult ? pfaLastResult.premiums.final_face_amount_wan : 10)
        : (pfaLastResult && pfaLastCalc.rate > 0 ? Math.round(pcPaidUsd(pfaLastResult.premiums) * pfaLastCalc.rate / 1000) / 10 : 100);
      pcRenderPanel();
    }));
    document.getElementById('pc-value').addEventListener('input', e => { pfaCompare.value = Number(e.target.value); });
    document.getElementById('pc-run').addEventListener('click', pcRun);
    if (pfaCompare.results) pcRenderResult();
  }

  async function pcRun() {
    const out = document.getElementById('pc-result');
    const val = id => (document.getElementById(id) || {}).value;
    const y = val('pfa-birth-year'), m = val('pfa-birth-month'), d = val('pfa-birth-day');
    if (!y || !m || !d) { out.innerHTML = '<div class="pc-err">請先在上方填寫客戶生日</div>'; return; }
    if (!pfaCompare.selected.size) { out.innerHTML = '<div class="pc-err">請至少選擇一項商品</div>'; return; }
    if (!(pfaCompare.value > 0)) { out.innerHTML = '<div class="pc-err">請輸入比較基準金額</div>'; return; }
    const rate = pfaRate.value;
    if (pfaCompare.basis === 'total' && !(rate > 0)) { out.innerHTML = '<div class="pc-err">尚未取得美元匯率</div>'; return; }

    const list = pcAllVariants().filter(v => pfaCompare.selected.has(v.key));
    const age = calcInsuranceAndActualAge(y, m, d, new Date());
    pfaCompare.clientLabel = `${val('pfa-name') || '客戶'}・${val('pfa-gender')}・保險年齡 ${age ? age.insuranceAge : '—'} 歲`;
    pfaCompare.rate = rate; pfaCompare.date = pfaRate.date;
    pfaCompare.order = list.map(v => v.key);
    pfaCompare.results = {};
    pfaCompare.running = true;
    const runBtn = document.getElementById('pc-run');
    runBtn.disabled = true;

    const progress = () => {
      const done = Object.keys(pfaCompare.results).length;
      runBtn.textContent = `比較中…（${done}/${list.length}）`;
      out.innerHTML = `<div class="pc-loading"><div class="cs-spinner"></div>正在用官方 Excel 試算各商品（${done}/${list.length}），每項約 3～10 秒</div>`;
    };
    progress();

    const one = async v => {
      const p = v.p;
      const payload = {
        name: val('pfa-name') || '客戶', gender: val('pfa-gender') || '女',
        birth_year: Number(y), birth_month: Number(m), birth_day: Number(d),
        payment_term: v.term, payment_freq: v.freq,
        dividend_scenario: '中分紅', relationship: val('pfa-relationship') || '同被保險人',
        discount: val('pfa-discount') || '無', death_benefit_pct: 0, installment_period: 20, want_pdf: false,
      };
      if (pfaCompare.basis === 'total') {
        payload.input_mode = 'premium';
        payload.premium_amount = Math.round(pfaCompare.value * 10000 / rate / v.term);
      } else {
        payload.input_mode = 'face_amount';
        payload.face_amount_wan = pfaCompare.value;
      }
      try {
        const resp = await fetch(`${PFA_API_BASE}/api/${p.apiProduct}/calculate`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
        });
        const data = await resp.json();
        pfaCompare.results[v.key] = resp.ok ? data : { error: data.error || '試算失敗' };
      } catch (e) {
        pfaCompare.results[v.key] = { error: e.message === 'Failed to fetch' ? '連不上試算服務' : e.message };
      }
      progress();
    };
    // 依序試算（後端同一時間只能用 LibreOffice 算一筆，平行送出只會排隊）
    for (const v of list) await one(v);

    pfaCompare.running = false;
    runBtn.disabled = false;
    runBtn.textContent = `重新比較（${pfaCompare.selected.size} 項商品）`;
    pcRenderResult();
  }

  function pcRenderResult() {
    const out = document.getElementById('pc-result');
    if (!out || !pfaCompare.results) return;
    const variants = pcAllVariants();
    const cols = pfaCompare.order.map(key => {
      const v = variants.find(x => x.key === key);
      return v ? { p: v.p, v, d: pfaCompare.results[key] } : null;
    }).filter(c => c && c.d);
    const isUL = cols.some(c => c.p.tableType === 'UL');
    const bonusWord = isUL ? '含增值回饋分享金' : '含紅利';
    const keys = [...new Set(cols.filter(c => !c.d.error).flatMap(c => pfaScenarioKeys(c.d.tables)))];
    if (keys.length && !keys.includes(pfaCompare.scenario)) pfaCompare.scenario = keys[0];
    const twd = pfaTableCurrency === 'TWD' && pfaCompare.rate > 0;
    const money = v => (v === null || v === undefined) ? '—' : (twd ? '' : 'US$ ') + Math.round(twd ? v * pfaCompare.rate : v).toLocaleString('zh-TW');
    const rowsOf = d => (d.tables && d.tables[pfaCompare.scenario] && d.tables[pfaCompare.scenario].rows) || [];
    // 含紅利總金額（官方「年度末解約／身故時可領總金額」）；分紅為零情境的欄位可能空白，改用保證金額
    const val = (r, key) => {
      if (!r) return null;
      if (key === 'cash') return r.total_cash_value ?? r.cash_value;
      if (key === 'death') return r.total_death_benefit ?? r.death_benefit;
      return r[key];
    };
    const at = (d, yr, key) => val(rowsOf(d).find(r => Math.round(r.policy_year) === yr), key);
    const ok = c => !c.d.error;

    // 每一列：取各商品數值，數值型的列標出最佳（最大，或回本年度最早）
    const metric = (label, fn, opts = {}) => {
      const vals = cols.map(c => ok(c) ? fn(c) : null);
      const nums = vals.map(v => (v && typeof v.n === 'number') ? v.n : null).filter(n => n !== null);
      const best = nums.length > 1 ? (opts.lowBest ? Math.min(...nums) : Math.max(...nums)) : null;
      return `<tr class="${opts.cls || ''}"><th>${label}</th>${cols.map((c, i) => {
        if (!ok(c)) return i === 0 && false ? '' : '<td class="na">—</td>';
        const v = vals[i];
        if (!v) return '<td>—</td>';
        const isBest = best !== null && v.n === best && opts.highlight !== false;
        return `<td class="${isBest ? 'best' : ''}">${v.html}</td>`;
      }).join('')}</tr>`;
    };

    const scenarios = keys.map(key => {
      const any = cols.find(c => ok(c) && c.d.tables && c.d.tables[key]);
      const label = any.d.tables[key].label;
      return `<button class="scenario-tab ${key === pfaCompare.scenario ? 'active' : ''}" data-key="${key}">${label}</button>`;
    }).join('');
    const missing = [...new Set(cols.filter(c => ok(c) && !(c.d.tables && c.d.tables[pfaCompare.scenario])).map(c => c.p.code))];

    const head = `<tr><th></th>${cols.map(c => `<th class="pc-colhead"><div class="code">${c.p.code}</div><div class="nm">${c.p.fullName || ''}</div><div class="ty">${c.v.label}</div></th>`).join('')}</tr>`;
    const errRow = cols.some(c => !ok(c))
      ? `<tr class="pc-errrow"><th>試算狀態</th>${cols.map(c => ok(c) ? '<td>✓</td>' : `<td class="na">無法試算<br><small>${csEsc(c.d.error)}</small></td>`).join('')}</tr>` : '';

    const body = [
      errRow,
      metric('保額（萬美元）', c => ({ n: c.d.premiums.final_face_amount_wan, html: Number(c.d.premiums.final_face_amount_wan).toLocaleString('en-US', { maximumFractionDigits: 1 }) })),
      metric('保費', c => {
        const pr = c.d.premiums;
        return pr.payment_freq === '躉繳'
          ? { html: `躉繳 ${money(pr.first_year_premium)}` }
          : { html: `${money(pr.first_year_premium)}／年<br><small>× ${pr.payment_term} 年</small>` };
      }, { highlight: false }),
      metric('總繳實繳保費', c => ({ html: money(pcPaidUsd(c.d.premiums)) }), { highlight: false }),
      metric('回本年度<br><small>解約總金額 ≥ 累計保費</small>', c => {
        const r = rowsOf(c.d).find(r => val(r, 'cash') !== null && r.cum_premium && val(r, 'cash') >= r.cum_premium);
        return r ? { n: -Math.round(r.policy_year), html: `第 ${Math.round(r.policy_year)} 年<br><small>${Math.round(r.age)} 歲</small>` } : { html: '未回本' };
      }, { cls: 'pc-key' }),
      ...PC_YEARS.map((yr, i) => metric(`${i === 0 ? `<span class="grp">解約總金額（${bonusWord}）</span>` : ''}第 ${yr} 年`, c => {
        const v = at(c.d, yr, 'cash');
        if (v === null || v === undefined) return null;
        const pct = Math.round(v / pcPaidUsd(c.d.premiums) * 100);
        return { n: v / pcPaidUsd(c.d.premiums), html: `${money(v)}<br><small>總繳的 ${pct}%</small>` };
      }, { cls: i === 0 ? 'pc-grp' : '' })),
      ...PC_YEARS.map((yr, i) => metric(`${i === 0 ? `<span class="grp">身故總金額（${bonusWord}）</span>` : ''}第 ${yr} 年`, c => {
        const v = at(c.d, yr, 'death');
        if (v === null || v === undefined) return null;
        return { n: v / pcPaidUsd(c.d.premiums), html: `${money(v)}<br><small>總繳的 ${(v / pcPaidUsd(c.d.premiums)).toFixed(1)} 倍</small>` };
      }, { cls: i === 0 ? 'pc-grp' : '' })),
    ].join('');

    out.innerHTML = `
      <div class="pc-result-head">
        <div class="pc-client">${csEsc(pfaCompare.clientLabel)}｜${pfaCompare.basis === 'total' ? `總繳保費 ${pfaCompare.value} 萬台幣` : `保額 ${pfaCompare.value} 萬美元`}</div>
        <button class="pfa-currency-btn ${twd ? 'active' : ''}" id="pc-currency">${twd ? '顯示美元' : `換算新台幣<small>${pfaCompare.date ? pfaCompare.date + ' ' : ''}匯率 ${pfaCompare.rate}</small>`}</button>
      </div>
      <div class="scenario-tabs pc-scen">${scenarios}</div>
      ${missing.length ? `<div class="pc-note">${missing.join('、')} 的官方試算表未提供此情境（只有目前宣告利率），該欄顯示「—」。</div>` : ''}
      <div class="pc-table-wrap"><table class="pc-table">${head}${body}</table></div>
      <div class="pc-foot">★ 底色標示為該列最佳（以「相對總繳保費」比較；回本年度越早越好）。${isUL
        ? '解約／身故總金額為官方試算表「年度末解約／身故時可領總金額（預估值）」，含依目前宣告利率累積的增值回饋分享金。宣告利率非固定，增值回饋分享金非保證，實際以保單條款及建議書為準。'
        : '解約／身故總金額為官方試算表「年度末解約／身故時可領總金額」：解約總金額＝保證解約金＋紅利增加保額的解約金＋終期紅利（依所選分紅情境）；「假設分紅金額可能為零」即為保證金額。紅利非保證，實際以保單條款及建議書為準。'}${twd ? '台幣金額依比較當時匯率換算，僅供參考。' : ''}</div>
    `;
    out.querySelectorAll('.pc-scen .scenario-tab').forEach(t => t.addEventListener('click', () => {
      pfaCompare.scenario = t.dataset.key; pcRenderResult();
    }));
    document.getElementById('pc-currency').addEventListener('click', () => {
      pfaTableCurrency = pfaTableCurrency === 'TWD' ? 'USD' : 'TWD';
      pcRenderResult();
      if (pfaCurrentTable) renderPFATable(pfaCurrentTable);
    });
  }

  // ---- 保額型分紅：台幣保費換算與美元匯率 ----
  // 匯率預設取 open.er-api.com 的即時中間價，可手動修改；切換商品分頁時沿用同一個匯率。
  const pfaRate = { value: null, date: '', info: '載入即時匯率中…', loaded: false, failed: false };
  let pfaLastCalc = { rate: null, term: null, date: '' };

  // 是否為躉繳：只有躉繳的商品固定 true；可選躉繳或分期的商品（FBX）依目前繳別
  function pfaIsSingle(product) {
    if (product.mixedSingle) {
      const el = document.getElementById('pfa-payment-freq');
      return el ? el.value === '躉繳' : true;
    }
    return (product.freqOptions || []).length === 1 && product.freqOptions[0] === '躉繳';
  }
  // 目前選定的繳費年期：多年期商品取下拉選單；FBX 躉繳=1、分期=2；其餘為商品固定年期
  function pfaTerm(product) {
    if (product.termOptions) {
      const el = document.getElementById('pfa-term');
      return el ? Number(el.value) : product.termOptions[0];
    }
    if (product.mixedSingle) return pfaIsSingle(product) ? 1 : product.paymentTerm;
    return product.paymentTerm;
  }
  // FBX 切換躉繳／分期時，同步年期顯示、試算依據選項與標籤
  function pfaSyncTermUI(product) {
    const single = pfaIsSingle(product);
    const disp = document.getElementById('pfa-term-display');
    if (disp) disp.value = `${single ? '躉繳（一次繳清）' : pfaTerm(product) + ' 年期'}（${product.code}）`;
    const totalPill = document.querySelector('.radio-pill[data-value="total_twd"]');
    if (totalPill) {
      totalPill.style.display = single ? 'none' : '';
      if (single && totalPill.classList.contains('active')) {
        document.querySelector('.radio-pill[data-value="annual_twd"]').click();
      }
    }
    ['pfa-mode-annual-label', 'pfa-annual-label'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.textContent = single ? '躉繳保費' : '年繳保費';
    });
    const total = document.getElementById('pfa-total-twd');
    if (total && !total.dataset.touched) total.value = 30 * pfaTerm(product);
    pfaUpdateConversion();
    if (typeof dvUpdateAge === 'function') dvUpdateAge();
  }

  // 依試算依據換算成美元年繳保費（元，取整數）
  function pfaAnnualUsd(product, mode, rate) {
    const annualTwdWan = mode === 'total_twd'
      ? Number(document.getElementById('pfa-total-twd').value) / pfaTerm(product)
      : Number(document.getElementById('pfa-annual-twd').value);
    return Math.round(annualTwdWan * 10000 / rate);
  }

  function pfaUpdateConversion() {
    const p = dv.moduleIndex !== null ? MODULES[dv.moduleIndex].products[dv.productIndex] : null;
    const rateEl = document.getElementById('pfa-usd-rate');
    if (!p || !rateEl) return;
    const rate = Number(rateEl.value);
    const usd = v => `US$ ${Math.round(v).toLocaleString('en-US')}`;
    const a = document.getElementById('pfa-conv-annual');
    const t = document.getElementById('pfa-conv-total');
    if (!(rate > 0)) {
      if (a) a.textContent = '請先輸入美元匯率';
      if (t) t.textContent = '請先輸入美元匯率';
      return;
    }
    const unit = pfaIsSingle(p) ? '（一次繳清）' : '／年';
    const rateLabel = `（${rate === pfaRate.value && pfaRate.date ? pfaRate.date + ' ' : ''}匯率 ${rate}）`;
    if (a) a.textContent = `≈ ${usd(pfaAnnualUsd(p, 'annual_twd', rate))}${unit}${rateLabel}`;
    if (t) {
      const per = Number(document.getElementById('pfa-total-twd').value) / pfaTerm(p);
      t.textContent = `÷ ${pfaTerm(p)} 年 = 年繳 ${Math.round(per * 100) / 100} 萬台幣 ≈ ${usd(pfaAnnualUsd(p, 'total_twd', rate))}／年${rateLabel}`;
    }
  }

  async function pfaLoadRate() {
    if (pfaRate.loaded) return;
    try {
      const r = await fetch('https://open.er-api.com/v6/latest/USD', { cache: 'no-store' });
      const d = await r.json();
      const twd = d && d.rates && d.rates.TWD;
      if (!twd) throw new Error('no rate');
      const dt = new Date((d.time_last_update_unix || Date.now() / 1000) * 1000);
      pfaRate.value = Math.round(twd * 100) / 100;   // 取到小數 2 位，換算與顯示一致
      pfaRate.date = `${dt.getMonth() + 1}/${dt.getDate()}`;
      pfaRate.info = `${pfaRate.date} 即時匯率`;
      pfaRate.loaded = true;
      pfaRate.failed = false;
      const el = document.getElementById('pfa-usd-rate');
      if (el && !el.value) el.value = pfaRate.value;
    } catch (e) {
      pfaRate.info = '無法取得即時匯率，請手動輸入';
      pfaRate.failed = true;
      const sec = document.getElementById('pfa-rate-section');
      if (sec) sec.style.display = '';
    }
    const info = document.getElementById('pfa-rate-info');
    if (info) info.textContent = pfaRate.info;
    pfaUpdateConversion();
  }

  let pfaLastResult = null;

  async function submitPFACalc(product) {
    const errorEl = document.getElementById('pfa-error');
    const loadingEl = document.getElementById('pfa-loading');
    const resultBox = document.getElementById('pfa-result-box');
    const btn = document.getElementById('pfa-submit-btn');
    errorEl.style.display = 'none';
    resultBox.style.display = 'none';

    const birthYear = document.getElementById('pfa-birth-year').value;
    const birthMonth = document.getElementById('pfa-birth-month').value;
    const birthDay = document.getElementById('pfa-birth-day').value;
    if (!birthYear || !birthMonth || !birthDay) {
      errorEl.textContent = '請填寫完整的生日（民國年／月／日）';
      errorEl.style.display = 'block';
      return;
    }

    const inputMode = document.getElementById('pfa-input-mode').value;
    const payload = {
      name: document.getElementById('pfa-name').value || '客戶',
      gender: document.getElementById('pfa-gender').value,
      birth_year: Number(birthYear),
      birth_month: Number(birthMonth),
      birth_day: Number(birthDay),
      payment_term: pfaTerm(product),
      payment_freq: document.getElementById('pfa-payment-freq').value,
      dividend_scenario: document.getElementById('pfa-dividend-scenario').value,
      bonus_method: (document.getElementById('pfa-bonus-method') || {}).value,
      input_mode: inputMode,
      relationship: document.getElementById('pfa-relationship').value,
      discount: document.getElementById('pfa-discount').value,
      death_benefit_pct: Number(document.getElementById('pfa-death-benefit-pct').value || 0),
      installment_period: Number(document.getElementById('pfa-installment-period').value),
      want_pdf: true,
    };
    const rate = Number(document.getElementById('pfa-usd-rate').value);
    if (inputMode === 'face_amount') {
      payload.face_amount_wan = Number(document.getElementById('pfa-face-amount').value);
    } else {
      // 台幣保費 → 美元年繳保費（官方 Excel 的保費換算保額一律以年繳保費計算，與繳別無關）
      if (!(rate > 0)) {
        errorEl.textContent = '請輸入美元匯率';
        errorEl.style.display = 'block';
        return;
      }
      const annualUsd = pfaAnnualUsd(product, inputMode, rate);
      if (!(annualUsd > 0)) {
        errorEl.textContent = '請輸入保費金額';
        errorEl.style.display = 'block';
        return;
      }
      payload.input_mode = 'premium';
      payload.premium_amount = annualUsd;
    }
    pfaLastCalc = { rate: rate > 0 ? rate : null, term: pfaTerm(product), date: rate === pfaRate.value ? pfaRate.date : '' };
    pfaCurrentProduct = product;

    btn.disabled = true;
    loadingEl.style.display = 'block';

    try {
      const resp = await fetch(`${PFA_API_BASE}/api/${product.apiProduct}/calculate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      if (!resp.ok) {
        throw new Error(data.error || '試算失敗，請確認輸入內容');
      }
      pfaLastResult = data;
      renderPFAResults(data);
    } catch (err) {
      errorEl.textContent = '試算失敗：' + err.message + '（若持續發生，可能是後端服務剛啟動需要暖機，請稍後再試一次）';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      loadingEl.style.display = 'none';
    }
  }

  const PFA_SCENARIO_ORDER = ['most_likely', 'lower', 'zero_possible'];

  function fmtNum(v) {
    if (v === null || v === undefined || v === '') return '—';

  function renderPFAResults(data) {
    const summaryEl = document.getElementById('pfa-summary-grid');

    const twdWan = v => (Math.round(v * pfaLastCalc.rate / 100) / 100).toLocaleString('zh-TW');

        ${pfaLastCalc.rate ? `<div class="cell twd"><div class="label">台幣實繳保費</div><div class="value">${twdWan(p.first_year_premium)}<small> 萬</small></div><div class="note">${rateLabel}</div></div>` : ''}

    } else {

      summaryEl.innerHTML = `

      <div class="summary-tile"><div class="label">續年實繳保費（美元）</div><div class="value">${fmtNum(p.renewal_year_premium)}</div></div>
      ${pfaLastCalc.rate ? `<div class="summary-tile"><div class="label">首年實繳（折合台幣，${rateLabel}）</div><div class="value">${twdWan(p.first_year_premium)} 萬</div></div>
      <div class="summary-tile"><div class="label">${term} 年總繳實繳（折合台幣）</div><div class="value">${twdWan(totalUsd)} 萬</div></div>` : ''}
    `;
    }

    const tabsEl = document.getElementById('pfa-scenario-tabs');
    tabsEl.innerHTML = pfaScenarioKeys(data.tables).map((key, i) => {
      const t = data.tables[key];
      return `<button class="scenario-tab ${i === 0 ? 'active' : ''}" data-key="${key}">${t ? t.label : key}</button>`;
    }).join('');
    const tools = [];
    if (pfaLastCalc.rate > 0) tools.push('<button class="pfa-currency-btn" id="pfa-currency-btn"></button>');
    else pfaTableCurrency = 'USD';
    if (document.getElementById('pfa-compare')) tools.push('<button class="pfa-currency-btn pfa-compare-btn" id="pfa-compare-btn">⇄ 比較商品</button>');
    if (tools.length) tabsEl.insertAdjacentHTML('beforeend', `<span class="pfa-tools">${tools.join('')}</span>`);
    if (pfaLastCalc.rate > 0) {
      document.getElementById('pfa-currency-btn').addEventListener('click', () => {
        pfaTableCurrency = pfaTableCurrency === 'TWD' ? 'USD' : 'TWD';
        renderPFATable(pfaCurrentTable);
        pcRenderResult();
      });
    }
    if (document.getElementById('pfa-compare-btn')) {
      document.getElementById('pfa-compare-btn').addEventListener('click', pfaToggleCompare);
      pcUpdateButton();
    }
    tabsEl.querySelectorAll('.scenario-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        tabsEl.querySelectorAll('.scenario-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderPFATable(data.tables[tab.dataset.key], tab.dataset.key);
      });
    });
    pfaLastResultForRatio = data;
    renderPFATable(data.tables[pfaScenarioKeys(data.tables)[0]], pfaScenarioKeys(data.tables)[0]);

    const downloadBtn = document.getElementById('pfa-download-btn');

  // 試算表顯示幣別：'USD'（官方建議書原始數字）或 'TWD'（依試算當下匯率換算，四捨五入到元）
  let pfaTableCurrency = 'USD';
  let pfaCurrentTable = null;

  // 報酬率／保障比／增值率：以含紅利（利變型含增值回饋分享金）的總金額計算；
  // 分紅商品只用中分紅（最可能紅利）情境，故只在該分頁顯示
  let pfaCurrentTableKey = null;
  let pfaLastResultForRatio = null;
  const RATIO_SCENARIOS = ['most_likely', 'declared'];

  function renderPFATable(tableData, key) {
    pfaCurrentTable = tableData;
    if (key !== undefined) pfaCurrentTableKey = key;
    const tableEl = document.getElementById('pfa-result-table');
    if (!tableData || !tableData.rows || !tableData.rows.length) {
      tableEl.innerHTML = '<tr><td>無資料</td></tr>';
      return;
    }
    const twd = pfaTableCurrency === 'TWD' && pfaLastCalc.rate > 0;
    const unit = twd ? '（台幣）' : '（美元）';
    const money = v => (v === null || v === undefined || v === '') ? '—'
      : Math.round(twd ? v * pfaLastCalc.rate : v).toLocaleString('zh-TW');
    const columns = pfaCurrentProduct && pfaCurrentProduct.tableType === 'UL' ? UL_TABLE_COLUMNS : PFA_TABLE_COLUMNS;
    const head = '<tr>' + columns.map(c =>
      `<th>${c.label}${c.key === 'policy_year' || c.key === 'age' ? '' : `<br><small>${unit}</small>`}</th>`).join('') + '</tr>';
    const showRatio = RATIO_SCENARIOS.includes(pfaCurrentTableKey);
    const faceUsd = pfaLastResultForRatio ? pfaLastResultForRatio.premiums.final_face_amount_wan * 10000 : null;
    const pct = v => `${v > 0 ? '+' : ''}${(v * 100).toFixed(1)}%`;
    const cashOf = r => r ? (r.total_cash_value ?? r.cash_value) : null;
    const ratioCells = (row, prev) => {
      const cash = cashOf(row);
      const prevCash = cashOf(prev);
      const death = row.total_death_benefit ?? row.death_benefit;
      const cum = row.cum_premium;
      const ret = (cash !== null && cum) ? (cash - cum) / cum : null;
      const prot = (death !== null && faceUsd) ? death / faceUsd : null;
      // 增值率＝本年度解約總金額 ÷ 前一年度解約總金額
      const grow = (cash !== null && prevCash) ? cash / prevCash : null;
      return `<td class="ratio ${ret !== null && ret >= 0 ? 'pos' : ''}">${ret === null ? '—' : ret < 0 ? '' : pct(ret)}</td>`
        + `<td class="ratio">${prot === null ? '—' : prot.toFixed(2) + ' 倍'}</td>`
        + `<td class="ratio">${grow === null ? '—' : (grow * 100).toFixed(1) + '%'}</td>`;
    };
    const ratioHead = showRatio
      ? `<th class="ratio">報酬率<br><small>(解約−累計)÷累計</small></th><th class="ratio">保障比<br><small>身故÷保額</small></th><th class="ratio">增值率<br><small>本年÷前一年解約</small></th>`
      : '';
    const body = tableData.rows.map((row, i) =>
      '<tr>' + columns.map(c => `<td>${c.key === 'policy_year' || c.key === 'age' ? (row[c.key] === null || row[c.key] === undefined ? '—' : Math.round(row[c.key])) : money(row[c.key])}</td>`).join('')
      + (showRatio ? ratioCells(row, tableData.rows[i - 1]) : '') + '</tr>'
    ).join('');
    tableEl.innerHTML = head.replace(/<\/tr>$/, ratioHead + '</tr>') + body;
    const note = document.getElementById('pfa-ratio-note');
    if (note) {
      const isUL = pfaCurrentProduct && pfaCurrentProduct.tableType === 'UL';
      note.textContent = showRatio
        ? `報酬率、保障比、增值率以「年度末${isUL ? '解約／身故時可領總金額（含增值回饋分享金）' : '解約／身故時可領總金額（含中分紅紅利）'}」計算，增值率＝本年度÷前一年度解約總金額；保額為基本保額 ${faceUsd ? Math.round(faceUsd).toLocaleString('en-US') : '—'} 美元。表中「身故保障、解約金」欄為不含紅利的保證金額。`
        : '報酬率、保障比、增值率以中分紅（最可能紅利）計算，請切換至「最可能紅利」查看。';
    }
    const btn = document.getElementById('pfa-currency-btn');
    if (btn) {
      btn.classList.toggle('active', twd);
      btn.innerHTML = twd
        ? `顯示美元`
        : `換算新台幣<small>${pfaLastCalc.date ? pfaLastCalc.date + ' ' : ''}匯率 ${pfaLastCalc.rate}</small>`;
    }
  }

  function downloadPFAPdf(base64) {
    downloadPdfBlob(base64, '建議書.pdf');

  function downloadPdfBlob(base64, filename) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  // ============================================================
  // 防癌險共用：保險年齡計算（其他商品也會用到）與年度明細欄位定義
  // ============================================================
  // ---- 保險年齡／實際年齡即時試算（與官方 Excel 之六個月進位規則一致） ----
  // 保險年齡：與最近一次生日相差超過六個月（含當日已過生日者以六個月整為界）即加算一歲；
  // 實際年齡：單純的足歲（週歲）。
  function calcInsuranceAndActualAge(rocYear, month, day, today) {
    const adBirthYear = Number(rocYear) + 1911;
    const birth = new Date(adBirthYear, Number(month) - 1, Number(day));
    if (isNaN(birth.getTime())) return null;

    const todayYear = today.getFullYear();
    const todayMonth = today.getMonth() + 1;
    const todayDay = today.getDate();
    const birthYear = birth.getFullYear();
    const birthMonth = birth.getMonth() + 1;
    const birthDay = birth.getDate();

    if (birth > today) return null; // 尚未出生

    // 實際年齡（足歲）
    let actualAge = todayYear - birthYear;
    if (todayMonth < birthMonth || (todayMonth === birthMonth && todayDay < birthDay)) {
      actualAge -= 1;
    }

    // 保險年齡（滿六個月進位制，邏輯對應原始 Excel 公式）
    let insuranceAge;
    if (todayMonth < birthMonth) {
      const diff = todayMonth + 12 - birthMonth;
      insuranceAge = (diff > 6 || (diff === 6 && todayDay > birthDay))
        ? (todayYear - 1 - birthYear + 1)
        : (todayYear - 1 - birthYear);
    } else {
      const diff = todayMonth - birthMonth;
      insuranceAge = (diff > 6 || (diff === 6 && todayDay > birthDay))
        ? (todayYear - birthYear + 1)
        : (todayYear - birthYear);
    }

    return { insuranceAge, actualAge };
  }
