<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建議書系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #eef4fb 0%, #f7f9fc 40%, #f5f5f7 100%);
    color: #1d1d1f;
    min-height: 100vh;
  }
  .container { width: 90%; max-width: 900px; margin: 0 auto; padding: 2.5rem 1rem; }
  @media (max-width: 640px) {
    .container { padding: 1.5rem 1rem; }
  }

  /* ---------- 密碼鎖畫面 ---------- */
  #lock-screen {
    position: fixed; inset: 0; z-index: 999;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #eef4fb 0%, #f7f9fc 40%, #f5f5f7 100%);
  }
  .lock-card {
    background: #fff; border-radius: 22px; padding: 2.5rem 2rem;
    width: 90%; max-width: 340px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  .lock-icon {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 1.25rem;
    background: #eef6ff; display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .lock-card h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.4rem; letter-spacing: -0.01em; }
  .lock-card p { font-size: 13px; color: #86868b; margin-bottom: 1.5rem; }
  #password-input {
    width: 100%; font-size: 18px; font-weight: 600; text-align: center;
    letter-spacing: 4px; padding: 12px 14px; border-radius: 12px;
    border: 1.5px solid #e5e5ea; background: #f9f9fb; color: #1d1d1f;
    margin-bottom: 0.9rem; font-family: inherit;
  }
  #password-input:focus { outline: none; border-color: #0071e3; background: #fff; box-shadow: 0 0 0 4px rgba(0,113,227,0.08); }
  #unlock-btn {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: #0071e3; color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  #unlock-btn:hover { background: #0060c2; }
  #lock-error { color: #d0392b; font-size: 13px; margin-top: 0.7rem; min-height: 16px; }

  /* ---------- 共用元件 ---------- */
  .back-link {
    display: inline-flex; align-items: center; gap: 4px; margin-bottom: 16px;
    font-size: 14px; color: #0071e3; text-decoration: none; font-weight: 600;
    cursor: pointer; background: none; border: none; padding: 0; font-family: inherit;
  }
  h1.page-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
  .subtitle { font-size: 14px; color: #86868b; margin-bottom: 2rem; }

  /* ---------- 首頁：模組卡片 ---------- */
  .module-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;
  }
  @media (max-width: 560px) { .module-grid { grid-template-columns: 1fr; } }
  .module-card {
    background: #fff; border-radius: 18px; padding: 20px;
    display: flex; align-items: center; gap: 14px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.04); border: 1.5px solid transparent;
    transition: all .15s; text-align: left;
  }
  .module-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,0.08); border-color: #0071e3; }
  .module-icon {
    width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
    background: #eef6ff; display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .module-info { flex: 1; }
  .module-name { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
  .module-count { font-size: 12.5px; color: #86868b; }
  .module-arrow { color: #c7c7cc; font-size: 18px; }

  /* ---------- 模組內：商品列表 ---------- */
  .product-list { display: flex; flex-direction: column; gap: 10px; }
  .product-row {
    background: #fff; border-radius: 16px; padding: 16px 18px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    border: 1.5px solid transparent; transition: all .15s;
  }
  .product-row:hover { border-color: #0071e3; background: linear-gradient(135deg,#eef6ff,#f5faff); }
  .product-code { font-size: 15.5px; font-weight: 700; letter-spacing: 0.02em; }
  .product-status {
    font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  }
  .product-status.pending { background: #fdf1e6; color: #b56a1a; }
  .product-status.ready { background: #e7f7ee; color: #1a8a3c; }

  /* ---------- 商品詳細（試算 / 建議書產出） ---------- */
  .product-detail-card {
    background: #fff; border-radius: 18px; padding: 28px 24px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.04);
  }
  .product-detail-card .code-badge {
    display: inline-block; font-size: 13px; font-weight: 700; color: #0071e3;
    background: #eef6ff; padding: 4px 12px; border-radius: 999px; margin-bottom: 12px;
  }
  .product-detail-card h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
  .placeholder-box {
    margin-top: 1.2rem; padding: 22px; border-radius: 14px;
    background: #f9fafc; border: 1.5px dashed #d8dce3;
    color: #6e6e73; font-size: 14px; line-height: 1.7;
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ---------- 試算表單 ---------- */
  .form-section { margin-top: 1.4rem; }
  .form-section + .form-section { margin-top: 1.8rem; padding-top: 1.4rem; border-top: 1px solid #eee; }
  .form-section-title { font-size: 13px; font-weight: 700; color: #6e6e73; margin-bottom: 12px; letter-spacing: 0.02em; }
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: #444; }
  .field-note { font-size: 12.5px; color: #86868b; margin-top: 6px; }
  .age-hint {
    margin-top: 8px; padding: 8px 12px; border-radius: 10px;
    background: #eef6ff; color: #0071e3; font-size: 13px; font-weight: 600;
  }
  .field input[type="text"], .field input[type="number"], .field select {
    padding: 10px 12px; border-radius: 10px; border: 1.5px solid #e5e5ea;
    background: #f9f9fb; font-size: 14.5px; font-family: inherit; color: #1d1d1f;
  }
  .field input:focus, .field select:focus {
    outline: none; border-color: #0071e3; background: #fff; box-shadow: 0 0 0 3px rgba(0,113,227,0.08);
  }
  .birth-row { display: flex; gap: 8px; align-items: center; }
  .birth-row input { width: 100%; text-align: center; }
  .birth-row span { font-size: 13px; color: #86868b; flex-shrink: 0; }
  .radio-group { display: flex; gap: 10px; }
  .radio-pill {
    flex: 1; text-align: center; padding: 9px 10px; border-radius: 10px;
    border: 1.5px solid #e5e5ea; background: #f9f9fb; font-size: 14px; font-weight: 600;
    color: #444; cursor: pointer; transition: all .12s; user-select: none;
  }
  .radio-pill.active { background: #0071e3; border-color: #0071e3; color: #fff; }
  details.advanced { margin-top: 1.4rem; }
  details.advanced > summary {
    cursor: pointer; font-size: 13px; font-weight: 700; color: #0071e3; list-style: none;
  }
  details.advanced > summary::-webkit-details-marker { display: none; }
  details.advanced .form-grid { margin-top: 12px; }
  .submit-btn {
    margin-top: 1.6rem; width: 100%; padding: 13px; border: none; border-radius: 12px;
    background: #0071e3; color: #fff; font-size: 15.5px; font-weight: 700; cursor: pointer;
    transition: background .15s;
  }
  .submit-btn:hover { background: #0060c2; }
  .submit-btn:disabled { background: #b9d7f5; cursor: not-allowed; }
  .calc-error {
    margin-top: 1rem; padding: 12px 14px; border-radius: 10px;
    background: #fdeeec; color: #b3261e; font-size: 13.5px; display: none;
  }
  .calc-loading {
    margin-top: 1.4rem; text-align: center; color: #86868b; font-size: 13.5px; display: none;
  }

  /* ---------- 試算結果 ---------- */
  .result-box { margin-top: 1.8rem; padding-top: 1.6rem; border-top: 1px solid #eee; display: none; }
  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1.4rem; }
  @media (max-width: 560px) { .summary-grid { grid-template-columns: 1fr; } }
  .summary-tile { background: #f9fafc; border-radius: 12px; padding: 12px 14px; }
  .summary-tile .label { font-size: 12px; color: #86868b; margin-bottom: 4px; }
  .summary-tile .value { font-size: 17px; font-weight: 700; color: #1d1d1f; }
  .scenario-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .scenario-tab {
    padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: #f0f0f2; color: #555; cursor: pointer; border: none; font-family: inherit;
  }
  .scenario-tab.active { background: #0071e3; color: #fff; }
  .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid #eee; max-height: 420px; overflow-y: auto; }
  table.result-table { width: 100%; border-collapse: collapse; font-size: 15px; white-space: nowrap; }
  table.result-table th {
    position: sticky; top: 0; background: #f5f5f7; padding: 9px 12px; text-align: right;
    font-weight: 700; color: #444; border-bottom: 1px solid #e5e5ea;
  }
  table.result-table th:first-child, table.result-table td:first-child { text-align: center; padding-right: 6px; }
  table.result-table th:nth-child(2), table.result-table td:nth-child(2) { text-align: center; padding-left: 6px; }
  table.result-table td { padding: 8px 12px; text-align: right; border-bottom: 1px solid #f2f2f4; }
  table.result-table tr:nth-child(even) { background: #fafafc; }
  .download-pdf-btn {
    margin-top: 1.2rem; width: 100%; padding: 12px; border-radius: 12px;
    background: #1a8a3c; color: #fff; font-size: 15px; font-weight: 700; border: none;
    cursor: pointer; transition: background .15s;
  }
  .download-pdf-btn:hover { background: #157030; }
  .download-pdf-btn:disabled { background: #a8d4b8; cursor: not-allowed; }

  /* ---------- 男女防癌險：商品試算工作台（CLZ / CLX / CIA / CIB） ---------- */
  #view-cancer .back-link { margin-bottom: 18px; }
  .cs-tabs {
    display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 6px;
    max-width: 720px; margin: 0 auto 30px; padding: 8px;
    background: #fff; border-radius: 22px; border: 1px solid #eef1f6;
    box-shadow: 0 8px 28px rgba(30,58,138,0.08);
  }
  .cs-tab {
    border: none; background: transparent; border-radius: 16px; padding: 12px 6px;
    cursor: pointer; font-family: inherit; transition: background .15s, box-shadow .15s;
  }
  .cs-tab:hover { background: #f3f6fc; }
  .cs-tab .code { display: block; font-family: 'Montserrat', -apple-system, sans-serif; font-weight: 800; font-size: 20px; color: #2b3242; letter-spacing: 0.01em; }
  .cs-tab .sub { display: block; margin-top: 3px; font-size: 12px; color: #7b8494; white-space: nowrap; }
  .cs-tab.active { background: linear-gradient(135deg, #2554e0 0%, #1e3a8a 100%); box-shadow: 0 8px 18px rgba(30,64,175,0.32); }
  .cs-tab.active .code, .cs-tab.active .sub { color: #fff; }

  .cs-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 24px; }
  .cs-code { font-family: 'Montserrat', -apple-system, sans-serif; font-weight: 800; font-size: 58px; line-height: 1; color: #1e3a8a; letter-spacing: -0.01em; }
  .cs-desc { margin-top: 12px; font-size: 13.5px; color: #7b8494; }
  .cs-pill { flex-shrink: 0; font-size: 13.5px; font-weight: 700; color: #1e3a8a; background: #eef3fc; border: 1px solid #d9e3f7; padding: 8px 16px; border-radius: 999px; }

  .cs-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 22px; align-items: start; }
  .cs-card { background: #fff; border-radius: 24px; padding: 28px 26px; box-shadow: 0 10px 30px rgba(30,58,138,0.06); }
  .cs-sec { display: flex; align-items: center; gap: 12px; margin: 26px 0 14px; font-size: 12.5px; font-weight: 700; color: #8a93a3; letter-spacing: 0.06em; }
  .cs-sec.first { margin-top: 0; }
  .cs-sec::after { content: ''; flex: 1; height: 1px; background: #e7ebf2; }

  .cs-gender { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 10px 18px; border-radius: 14px; background: #eef3fc; border: 1px solid #d9e3f7; color: #1e3a8a; font-size: 15px; font-weight: 700; }
  .cs-gender .emoji { font-size: 20px; }
  .cs-birth { display: grid; grid-template-columns: 1.7fr 1fr 1fr; gap: 10px; }
  .cs-input.year::placeholder { font-size: 15px; }
  .cs-input {
    width: 100%; padding: 14px 16px; border-radius: 14px; border: 1.5px solid #e3e9f3; background: #f4f7fc;
    font-size: 17px; font-family: inherit; color: #1d2433; text-align: center; -moz-appearance: textfield;
  }
  .cs-input.year { text-align: left; }
  .cs-input::placeholder { color: #9aa3b2; }
  .cs-input:focus { outline: none; border-color: #2554e0; background: #fff; box-shadow: 0 0 0 4px rgba(37,84,224,0.1); }
  .cs-input::-webkit-outer-spin-button, .cs-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .cs-age { min-height: 18px; margin-top: 10px; font-size: 13px; font-weight: 600; color: #2554e0; }
  .cs-age.warn { color: #c2410c; }

  .cs-terms { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 12px; }
  .cs-term {
    padding: 16px 8px; border-radius: 16px; border: 1.5px solid #e3e9f3; background: #fff;
    cursor: pointer; text-align: center; font-family: inherit; transition: all .15s;
  }
  .cs-term:hover { border-color: #b7c8ef; }
  .cs-term .t { display: block; font-size: 19px; font-weight: 800; color: #2b3242; }
  .cs-term .r { display: block; margin-top: 5px; font-size: 12.5px; color: #7b8494; }
  .cs-term.active { border-color: #2554e0; background: #eef3fc; box-shadow: 0 0 0 3px rgba(37,84,224,0.12); }
  .cs-term.active .t { color: #1e3a8a; }
  .cs-term.off { opacity: .45; }

  .cs-face { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .cs-face-num { display: flex; align-items: baseline; gap: 10px; padding: 0 6px 4px; border-bottom: 2px solid #e3e9f3; }
  .cs-face-num input {
    width: 130px; border: none; background: transparent; text-align: center; -moz-appearance: textfield;
    font-family: 'Montserrat', -apple-system, sans-serif; font-weight: 800; font-size: 46px; color: #1e3a8a;
  }
  .cs-face-num input:focus { outline: none; }
  .cs-face-num input::placeholder { color: #1e3a8a; }
  .cs-face-num input::-webkit-outer-spin-button, .cs-face-num input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .cs-face-num .unit { font-size: 20px; font-weight: 700; color: #3a4150; }
  .cs-est { text-align: right; }
  .cs-est .l { font-size: 13px; color: #7b8494; }
  .cs-est .v { margin-top: 6px; font-family: 'Montserrat', -apple-system, sans-serif; font-weight: 800; font-size: 22px; color: #1e3a8a; }
  .cs-face-note { min-height: 18px; margin-top: 8px; font-size: 12.5px; color: #c2410c; }

  .cs-range {
    -webkit-appearance: none; appearance: none; width: 100%; height: 8px; margin: 22px 0 12px;
    border-radius: 999px; outline: none; cursor: pointer;
    background: linear-gradient(to right, #2554e0 var(--p, 0%), #d6e3fa var(--p, 0%));
  }
  .cs-range::-webkit-slider-thumb {
    -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%;
    background: #fff; border: 1px solid #d6dfee; box-shadow: 0 2px 8px rgba(30,58,138,0.25);
  }
  .cs-range::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 1px solid #d6dfee; box-shadow: 0 2px 8px rgba(30,58,138,0.25); }
  .cs-ticks { position: relative; height: 18px; margin: 0 14px; font-size: 12.5px; color: #7b8494; }
  .cs-ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }

  details.cs-adv { margin-top: 24px; border-top: 1px solid #e7ebf2; padding-top: 16px; }
  details.cs-adv > summary { cursor: pointer; list-style: none; font-size: 13px; font-weight: 700; color: #2554e0; }
  details.cs-adv > summary::-webkit-details-marker { display: none; }
  details.cs-adv .form-grid { margin-top: 14px; }

  .cs-panel {
    position: sticky; top: 20px; min-height: 440px; padding: 40px 28px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: #fff; border: 1.5px dashed #d6dfee; border-radius: 24px;
  }
  .cs-panel.result { border: 1px solid #e7ebf2; box-shadow: 0 10px 30px rgba(30,58,138,0.06); align-items: stretch; justify-content: flex-start; text-align: left; padding: 28px 26px; }
  .cs-icon { width: 78px; height: 78px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 34px; background: #eef3fc; border: 1px solid #d9e3f7; }
  .cs-panel h3 { margin-top: 26px; font-size: 19px; font-weight: 800; color: #1d2433; }
  .cs-panel .hint { margin-top: 10px; font-size: 14px; line-height: 1.75; color: #8a93a3; }
  .cs-panel .hint.err { color: #b3261e; }
  .cs-check { width: 100%; max-width: 330px; margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
  .cs-check div { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-radius: 12px; border: 1px solid #e7ebf2; background: #f8fafd; text-align: left; font-size: 15px; font-weight: 700; color: #2b3242; }
  .cs-check i { width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 2px solid #9aa3b2; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 12px; color: #fff; }
  .cs-check .done { color: #1e3a8a; background: #eef3fc; border-color: #d9e3f7; }
  .cs-check .done i { background: #2554e0; border-color: #2554e0; }
  .cs-spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #d6e3fa; border-top-color: #2554e0; animation: cs-spin .8s linear infinite; }
  @keyframes cs-spin { to { transform: rotate(360deg); } }

  .cs-res-tag { align-self: flex-start; font-size: 12.5px; font-weight: 700; color: #1e3a8a; background: #eef3fc; padding: 5px 12px; border-radius: 999px; }
  .cs-res-label { margin-top: 18px; font-size: 13.5px; color: #7b8494; }
  .cs-res-big { margin-top: 4px; font-family: 'Montserrat', -apple-system, sans-serif; font-weight: 800; font-size: 44px; line-height: 1.1; color: #1e3a8a; }
  .cs-res-big small { margin-left: 6px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 700; color: #3a4150; }
  .cs-res-rows { margin-top: 20px; border-top: 1px solid #eef1f6; }
  .cs-res-rows div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 2px; border-bottom: 1px solid #eef1f6; font-size: 14.5px; }
  .cs-res-rows span { color: #6b7383; }
  .cs-res-rows b { font-weight: 700; color: #1d2433; }
  .cs-res-note { margin-top: 12px; font-size: 12.5px; color: #8a93a3; line-height: 1.6; }
  .cs-pdf-btn {
    margin-top: 20px; width: 100%; padding: 14px; border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, #2554e0 0%, #1e3a8a 100%); color: #fff; font-size: 15px; font-weight: 700; font-family: inherit;
    box-shadow: 0 8px 18px rgba(30,64,175,0.25);
  }
  .cs-pdf-btn:disabled { opacity: .6; cursor: wait; }
  .cs-pdf-err { margin-top: 8px; font-size: 12.5px; color: #b3261e; }

  .cs-table-card { margin-top: 22px; display: none; }
  .cs-table-card h4 { margin-bottom: 14px; font-size: 15px; font-weight: 800; color: #1d2433; }

  @media (max-width: 760px) {
    .cs-grid { grid-template-columns: 1fr; }
    .cs-panel { position: static; min-height: 0; padding: 30px 20px; }
    .cs-code { font-size: 44px; }
    .cs-card { padding: 22px 18px; }
    .cs-tab { padding: 10px 2px; }
    .cs-tab .code { font-size: 16px; }
    .cs-tab .sub { font-size: 10.5px; line-height: 1.35; }
    .cs-tab .sub > span { display: block; }
    .cs-tab .sub .sep { display: none; }
    .cs-birth { grid-template-columns: 1fr 1fr; }

  let currentModuleIndex = null;

  // ---------- 密碼鎖 ----------
  function tryUnlock() {
    const input = document.getElementById('password-input');
    const errorEl = document.getElementById('lock-error');
    if (input.value === SITE_PASSWORD) {
      sessionStorage.setItem('proposalSystemUnlocked', '1');
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
    } else {
      errorEl.textContent = '密碼錯誤，請再試一次';
      input.value = '';
      input.focus();
    }
  }
  document.getElementById('unlock-btn').addEventListener('click', tryUnlock);
  document.getElementById('password-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryUnlock();
  });
  // 同一個瀏覽器分頁內，重新整理不用再輸入一次密碼
  if (sessionStorage.getItem('proposalSystemUnlocked') === '1') {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
  }

  // ---------- 畫面切換 ----------
  function switchView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  function showHome() {
    currentModuleIndex = null;
    switchView('view-home');
  }

  function showModule(index) {
    currentModuleIndex = index;
    const mod = MODULES[index];
    document.getElementById('module-title').textContent = mod.name;
    document.getElementById('module-subtitle').textContent = `共 ${mod.products.length} 項商品`;
    const listEl = document.getElementById('product-list');
    listEl.innerHTML = mod.products.map((p, i) => `
      <div class="product-row" onclick="showProduct(${index}, ${i})">
        <span class="product-code">${p.code}${p.genderLabel ? ` <span style="font-weight:400;color:#86868b;">${p.genderLabel}</span>` : ''}</span>
        ${p.status === 'ready' ? '' : `<span class="product-status ${p.status}">尚未建置</span>`}
      </div>
    `).join('');
    switchView('view-module');
  }

  function showProduct(moduleIndex, productIndex) {
    currentModuleIndex = moduleIndex;
    const mod = MODULES[moduleIndex];
    const product = mod.products[productIndex];
    if (product.calcType === 'CANCER') {
      showCancerStudio(moduleIndex, productIndex);
      return;
    }
    document.getElementById('product-code-badge').textContent = product.code;
    document.getElementById('product-name-title').textContent = `${mod.name} — ${product.code}`;
    const contentEl = document.getElementById('product-content');

    if (product.calcType === 'PFA') {
      contentEl.innerHTML = renderPFAFormHTML(product);
      initRadioGroups(contentEl);
      document.getElementById('pfa-submit-btn').addEventListener('click', () => submitPFACalc(product));
    } else if (product.calcType === 'LTS') {
      contentEl.innerHTML = renderLTSFormHTML(product);
      initRadioGroups(contentEl);
      document.getElementById('lts-submit-btn').addEventListener('click', () => submitLTSCalc(product));
      initLTSAgeHint();
    } else if (product.calcType === 'LTQT') {
      contentEl.innerHTML = renderLTQTFormHTML(product);
      initRadioGroups(contentEl);
      document.getElementById('ltqt-submit-btn').addEventListener('click', () => submitLTQTCalc(product));
      initLTQTAgeHint();
    } else if (product.calcType === 'SD') {
      contentEl.innerHTML = renderSDFormHTML(product);
      initRadioGroups(contentEl);
      document.getElementById('sd-submit-btn').addEventListener('click', () => submitSDCalc(product));
      initSDAgeHint();
    } else {
      contentEl.innerHTML = `<div class="placeholder-box">${
        product.status === 'ready'
          ? '（此商品的試算功能建置中）'
          : '此商品的建議書格式尚未上傳。上傳格式後，這裡會提供客戶資料輸入欄位、保費／保額試算，並可一鍵產出 PDF 建議書。'
      }</div>`;
    }
    switchView('view-product');
  }

  // ============================================================
  // PFA3 / PFA6 試算表單（呼叫後端 LibreOffice 重算引擎）
  // ============================================================
  const PFA_API_BASE = "https://proposal-calculator-backend-production.up.railway.app";

  function renderPFAFormHTML(product) {
    return `
      <div class="form-section">
        <div class="form-section-title">被保險人基本資料</div>
        <div class="form-grid">
          <div class="field">
            <label>姓名</label>
            <input type="text" id="pfa-name" value="客戶">
          </div>
          <div class="field">
            <label>性別</label>
            <div class="radio-group" data-target="pfa-gender">
              <div class="radio-pill active" data-value="女">女</div>
              <div class="radio-pill" data-value="男">男</div>
            </div>
            <input type="hidden" id="pfa-gender" value="女">
          </div>
        </div>
        <div class="field" style="margin-top:14px;">
          <label>生日（民國）</label>
          <div class="birth-row">
            <input type="number" id="pfa-birth-year" placeholder="年" min="1" max="200">
            <span>年</span>
            <input type="number" id="pfa-birth-month" placeholder="月" min="1" max="12">
            <span>月</span>
            <input type="number" id="pfa-birth-day" placeholder="日" min="1" max="31">
            <span>日</span>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">保單設定</div>
        <div class="form-grid">
          <div class="field">

            <input type="text" value="${product.paymentTerm} 年期（${product.code}）" disabled style="background:#f0f0f2;color:#86868b;">
          </div>
          <div class="field">
            <label>繳別</label>
            <select id="pfa-payment-freq">
              <option value="年繳">年繳</option>
              <option value="半年繳">半年繳</option>
              <option value="季繳">季繳</option>

            </select>

        </div>
        <div class="field" style="margin-top:14px;">

          </div>
          <input type="hidden" id="pfa-input-mode" value="face_amount">
        </div>
        <div class="form-grid" style="margin-top:14px;">
          <div class="field" id="pfa-face-amount-field">
            <label>保額（萬元）</label>
            <input type="number" id="pfa-face-amount" value="30" min="0" step="0.1">

          <div class="field" id="pfa-premium-field" style="display:none;">

              <option value="同被保險人">同被保險人</option>

      <div class="result-box" id="pfa-result-box">

      </div>
    `;
  }

  function initRadioGroups(root) {
    root.querySelectorAll('.radio-group').forEach(group => {
      const targetInput = document.getElementById(group.dataset.target);
      group.querySelectorAll('.radio-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          group.querySelectorAll('.radio-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          targetInput.value = pill.dataset.value;
          if (group.dataset.target === 'pfa-input-mode') {
            const isFace = pill.dataset.value === 'face_amount';
            document.getElementById('pfa-face-amount-field').style.display = isFace ? '' : 'none';
            document.getElementById('pfa-premium-field').style.display = isFace ? 'none' : '';
          }
        });
      });
    });
  }

  let pfaLastResult = null;

  async function submitPFACalc(product) {
    const errorEl = document.getElementById('pfa-error');
    const loadingEl = document.getElementById('pfa-loading');
    const resultBox = document.getElementById('pfa-result-box');
    const btn = document.getElementById('pfa-submit-btn');
    errorEl.style.display = 'none';
    resultBox.style.display = 'none';

    const birthYear = document.getElementById('pfa-birth-year').value;
    const birthMonth = document.getElementById('pfa-birth-month').value;
    const birthDay = document.getElementById('pfa-birth-day').value;
    if (!birthYear || !birthMonth || !birthDay) {
      errorEl.textContent = '請填寫完整的生日（民國年／月／日）';
      errorEl.style.display = 'block';
      return;
    }

    const inputMode = document.getElementById('pfa-input-mode').value;
    const payload = {
      name: document.getElementById('pfa-name').value || '客戶',
      gender: document.getElementById('pfa-gender').value,
      birth_year: Number(birthYear),
      birth_month: Number(birthMonth),
      birth_day: Number(birthDay),
      payment_term: product.paymentTerm,
      payment_freq: document.getElementById('pfa-payment-freq').value,
      dividend_scenario: document.getElementById('pfa-dividend-scenario').value,
      input_mode: inputMode,
      relationship: document.getElementById('pfa-relationship').value,
      discount: document.getElementById('pfa-discount').value,
      death_benefit_pct: Number(document.getElementById('pfa-death-benefit-pct').value || 0),
      installment_period: Number(document.getElementById('pfa-installment-period').value),
      want_pdf: true,
    };
    if (inputMode === 'face_amount') {
      payload.face_amount_wan = Number(document.getElementById('pfa-face-amount').value);
    } else {
      payload.premium_amount = Number(document.getElementById('pfa-premium').value);
    }

    btn.disabled = true;
    loadingEl.style.display = 'block';

    try {
      const resp = await fetch(`${PFA_API_BASE}/api/${product.apiProduct}/calculate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      if (!resp.ok) {
        throw new Error(data.error || '試算失敗，請確認輸入內容');
      }
      pfaLastResult = data;
      renderPFAResults(data);
    } catch (err) {
      errorEl.textContent = '試算失敗：' + err.message + '（若持續發生，可能是後端服務剛啟動需要暖機，請稍後再試一次）';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      loadingEl.style.display = 'none';
    }
  }

  const PFA_SCENARIO_ORDER = ['most_likely', 'lower', 'zero_possible'];
  const PFA_TABLE_COLUMNS = [
    { key: 'policy_year', label: '保單年度' },
    { key: 'age', label: '保險年齡' },
    { key: 'annual_premium', label: '年度保費' },

    { key: 'cash_value', label: '解約金' },
    { key: 'annual_dividend', label: '年度紅利' },
    { key: 'total_amount', label: '總保額' },
  ];

  function renderPFATable(tableData) {
    const tableEl = document.getElementById('pfa-result-table');
    if (!tableData || !tableData.rows || !tableData.rows.length) {
      tableEl.innerHTML = '<tr><td>無資料</td></tr>';

    }
    const head = '<tr>' + PFA_TABLE_COLUMNS.map(c => `<th>${c.label}</th>`).join('') + '</tr>';
    const body = tableData.rows.map(row =>
      '<tr>' + PFA_TABLE_COLUMNS.map(c => `<td>${c.key === 'policy_year' || c.key === 'age' ? (row[c.key] === null || row[c.key] === undefined ? '—' : Math.round(row[c.key])) : fmtNum(row[c.key])}</td>`).join('') + '</tr>'
    ).join('');
    tableEl.innerHTML = head + body;

  function downloadPFAPdf(base64) {
    downloadPdfBlob(base64, '建議書.pdf');
  }

  function downloadPdfBlob(base64, filename) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  // ============================================================
  // 防癌險共用：保險年齡計算（其他商品也會用到）與年度明細欄位定義
  // ============================================================
  // ---- 保險年齡／實際年齡即時試算（與官方 Excel 之六個月進位規則一致） ----
  // 保險年齡：與最近一次生日相差超過六個月（含當日已過生日者以六個月整為界）即加算一歲；
  // 實際年齡：單純的足歲（週歲）。
  function calcInsuranceAndActualAge(rocYear, month, day, today) {
    const adBirthYear = Number(rocYear) + 1911;
    const birth = new Date(adBirthYear, Number(month) - 1, Number(day));
    if (isNaN(birth.getTime())) return null;

    const todayYear = today.getFullYear();
    const todayMonth = today.getMonth() + 1;
    const todayDay = today.getDate();
    const birthYear = birth.getFullYear();
    const birthMonth = birth.getMonth() + 1;
    const birthDay = birth.getDate();

    if (birth > today) return null; // 尚未出生

    // 實際年齡（足歲）
    let actualAge = todayYear - birthYear;
    if (todayMonth < birthMonth || (todayMonth === birthMonth && todayDay < birthDay)) {
      actualAge -= 1;
    }

    // 保險年齡（滿六個月進位制，邏輯對應原始 Excel 公式）
    let insuranceAge;
    if (todayMonth < birthMonth) {
      const diff = todayMonth + 12 - birthMonth;
      insuranceAge = (diff > 6 || (diff === 6 && todayDay > birthDay))
        ? (todayYear - 1 - birthYear + 1)
        : (todayYear - 1 - birthYear);
    } else {
      const diff = todayMonth - birthMonth;
      insuranceAge = (diff > 6 || (diff === 6 && todayDay > birthDay))
        ? (todayYear - birthYear + 1)
        : (todayYear - birthYear);
    }

    return { insuranceAge, actualAge };
  }

  const CANCER_TABLE_COLUMNS = [
    { key: 'policy_year', label: '保單年度' },
    { key: 'age', label: '保險年齡' },

  // CIA / CIB（防癌終身健康保險）：對應官方建議書「投保利益表」欄位

    { key: 'policy_year', label: '保單年度' },
    { key: 'age', label: '保險年齡' },
    { key: 'annual_premium', label: '年度實繳保費' },

  // ============================================================
  // 男女防癌險（CLZ / CLX / CIA / CIB）試算工作台
  // 進入任一防癌險商品後，以上方分頁切換同分類的商品；
  // 生日、繳費年期、保額三項填齊後自動試算（不需按按鈕），
  // PDF 建議書則在按下下載時才另外請後端產生，讓即時試算保持快速。
  // 切換分頁時保留已填的生日／保額／進階選項，方便比較商品。
  // ============================================================
  const CANCER_API_BASE = PFA_API_BASE;
  const cs = {
    moduleIndex: null, productIndex: null,
    birthY: '', birthM: '', birthD: '', term: null, face: null,
    name: '客戶', freq: '年繳', firstPay: '金融機構轉帳', renewPay: '金融機構轉帳', discount: '無',
    reqSeq: 0, timer: null, lastKey: null, lastData: null,
  };

  function csEsc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function csProduct() { return MODULES[cs.moduleIndex].products[cs.productIndex]; }

  function showCancerStudio(moduleIndex, productIndex) {
    cs.moduleIndex = moduleIndex;
    currentModuleIndex = moduleIndex;
    cs.productIndex = productIndex;
    renderCancerStudio();
    switchView('view-cancer');
  }

  function switchCancerProduct(productIndex) {
    if (productIndex === cs.productIndex) return;
    cs.productIndex = productIndex;
    renderCancerStudio();
  }

  function renderCancerStudio() {
    const mod = MODULES[cs.moduleIndex];
    const p = csProduct();
    // 換商品時：新商品沒有的年期就清掉，保額夾回新商品的範圍
    if (cs.term && !p.terms.some(t => t.term === cs.term)) cs.term = null;
    if (cs.face !== null) cs.face = Math.min(p.faceMax, Math.max(p.faceMin, cs.face));
    cs.lastKey = null;
    cs.lastData = null;

    const tabProducts = mod.products.map((x, i) => ({ x, i })).filter(o => o.x.calcType === 'CANCER');
    const tabs = tabProducts.map(({ x, i }) => `
      <button class="cs-tab ${i === cs.productIndex ? 'active' : ''}" onclick="switchCancerProduct(${i})">
        <span class="code">${x.code}</span><span class="sub"><span>${x.shortName}</span><span class="sep">・</span><span>${x.typeLabel}</span></span>
      </button>`).join('');
    const isMale = p.fixedGender === '男';
    const ticks = p.faceTicks.map((v, idx) => {
      const pct = (v - p.faceMin) / (p.faceMax - p.faceMin) * 100;
      const last = idx === p.faceTicks.length - 1;
      return `<span style="left:${pct}%">${v}${last ? '萬' : ''}</span>`;
    }).join('');

    document.getElementById('cancer-studio').innerHTML = `
      <div class="cs-tabs" style="--n:${tabProducts.length}">${tabs}</div>

      <div class="cs-head">
        <div>
          <div class="cs-code">${p.code}</div>
          <div class="cs-desc">${p.fullName} · ${p.fixedGender}性 · ${p.rateVersion} 費率</div>
        </div>
        <div class="cs-pill">保費試算</div>
      </div>

      <div class="cs-grid">
        <div class="cs-card">
          <div class="cs-sec first">保戶基本資料</div>
          <div class="cs-gender"><span class="emoji">${isMale ? '👨🏻' : '👩🏻'}</span>本商品專屬 ${p.fixedGender}性 被保險人</div>
          <div class="cs-birth">
            <input class="cs-input year" id="cs-y" type="number" inputmode="numeric" placeholder="民國年 (e.g. 79)">
            <input class="cs-input" id="cs-m" type="number" inputmode="numeric" placeholder="月">
            <input class="cs-input" id="cs-d" type="number" inputmode="numeric" placeholder="日">
          </div>
          <div class="cs-age" id="cs-age"></div>

          <div class="cs-sec">繳費年期</div>
          <div class="cs-terms" id="cs-terms" style="--n:${p.terms.length}">
            ${p.terms.map(t => `
              <button class="cs-term" data-term="${t.term}">
                <span class="t">${t.term} 年期</span>
                <span class="r">${t.ageMin}～${t.ageMax} 歲投保</span>
              </button>`).join('')}
          </div>

          <div class="cs-sec">規劃保額</div>
          <div class="cs-face">
            <div class="cs-face-num">
              <input id="cs-face" type="number" inputmode="numeric" placeholder="0" min="${p.faceMin}" max="${p.faceMax}">
              <span class="unit">萬元</span>
            </div>
            <div class="cs-est"><div class="l" id="cs-est-l">年繳保費預估</div><div class="v" id="cs-est">—</div></div>
          </div>
          <input class="cs-range" id="cs-range" type="range" min="${p.faceMin}" max="${p.faceMax}" step="10" value="${p.faceMin}">
          <div class="cs-ticks">${ticks}</div>
          <div class="cs-face-note" id="cs-face-note"></div>

          <details class="cs-adv">
            <summary>進階選項（姓名・繳別・繳費方式・保費折扣）</summary>
            <div class="form-grid">
              <div class="field"><label>被保險人姓名（印於建議書）</label><input type="text" id="cs-name"></div>
              <div class="field"><label>繳別</label>
                <select id="cs-freq"><option>年繳</option><option>半年繳</option><option>季繳</option><option>月繳</option></select></div>
              <div class="field"><label>首期繳費方式</label>
                <select id="cs-first"><option>金融機構轉帳</option><option>一般信用卡</option><option>富邦信用卡</option><option>匯款</option></select></div>
              <div class="field"><label>續期繳費方式</label>
                <select id="cs-renew"><option>金融機構轉帳</option><option>一般信用卡</option><option>富邦信用卡</option><option>自行繳費</option></select></div>
              <div class="field"><label>專案保費折扣</label>
                <select id="cs-disc"><option>無</option><option>員工轉帳件</option></select></div>
            </div>
          </details>
        </div>

        <div class="cs-panel" id="cs-panel"></div>
      </div>

      <div class="cs-card cs-table-card" id="cs-table-card">
        <h4>保單年度明細</h4>
        <div class="table-wrap"><table class="result-table" id="cs-table"></table></div>
      </div>
    `;

    // 填回已保留的狀態
    const $ = id => document.getElementById(id);
    $('cs-y').value = cs.birthY; $('cs-m').value = cs.birthM; $('cs-d').value = cs.birthD;
    $('cs-face').value = cs.face ?? '';
    $('cs-name').value = cs.name; $('cs-freq').value = cs.freq;
    $('cs-first').value = cs.firstPay; $('cs-renew').value = cs.renewPay; $('cs-disc').value = cs.discount;

    // 事件
    [['cs-y', 'birthY'], ['cs-m', 'birthM'], ['cs-d', 'birthD']].forEach(([id, key]) =>
      $(id).addEventListener('input', e => { cs[key] = e.target.value.trim(); csRefresh(); }));
    $('cs-terms').querySelectorAll('.cs-term').forEach(btn => btn.addEventListener('click', () => {
      cs.term = Number(btn.dataset.term); csRefresh();
    }));
    $('cs-range').addEventListener('input', e => { cs.face = Number(e.target.value); $('cs-face').value = cs.face; csRefresh(); });
    $('cs-face').addEventListener('input', e => {
      const v = e.target.value === '' ? null : Number(e.target.value);
      cs.face = (v === null || isNaN(v)) ? null : v;
      csRefresh();
    });
    $('cs-face').addEventListener('change', e => {
      if (cs.face === null) return;
      cs.face = Math.min(p.faceMax, Math.max(p.faceMin, Math.round(cs.face)));
      e.target.value = cs.face; csRefresh();
    });
    [['cs-name', 'name', 'change'], ['cs-freq', 'freq', 'change'], ['cs-first', 'firstPay', 'change'],
     ['cs-renew', 'renewPay', 'change'], ['cs-disc', 'discount', 'change']].forEach(([id, key, ev]) =>
      $(id).addEventListener(ev, e => { cs[key] = e.target.value.trim() || (key === 'name' ? '客戶' : ''); csRefresh(); }));

    csRefresh();
  }

  // 生日檢查：回傳 { insuranceAge, actualAge } 或 null（未填完／日期不存在）
  function csAge() {
    const y = Number(cs.birthY), m = Number(cs.birthM), d = Number(cs.birthD);
    if (!cs.birthY || !cs.birthM || !cs.birthD) return null;
    if (!(y >= 1 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return { invalid: true };
    const dt = new Date(y + 1911, m - 1, d);
    if (dt.getMonth() !== m - 1 || dt.getDate() !== d) return { invalid: true };
    const r = calcInsuranceAndActualAge(y, m, d, new Date());
    return r || { invalid: true };
  }

  // 投保年齡下限以「足歲」判斷、上限以「保險年齡」判斷（與官方 Excel 投保年齡區間一致）
  function csTermAllowed(t, age) {
    return age.actualAge >= t.ageMin && age.insuranceAge <= t.ageMax;
  }

  function csRefresh() {
    const p = csProduct();
    const $ = id => document.getElementById(id);
    const age = csAge();
    const ageOk = age && !age.invalid;

    // 生日提示
    const ageEl = $('cs-age');
    if (!age) { ageEl.textContent = ''; ageEl.className = 'cs-age'; }
    else if (age.invalid) { ageEl.textContent = '請確認生日是否正確'; ageEl.className = 'cs-age warn'; }
    else { ageEl.textContent = `保險年齡 ${age.insuranceAge} 歲　實際年齡 ${age.actualAge} 歲`; ageEl.className = 'cs-age'; }

    // 年期卡片
    $('cs-terms').querySelectorAll('.cs-term').forEach(btn => {
      const t = p.terms.find(x => x.term === Number(btn.dataset.term));
      btn.classList.toggle('active', cs.term === t.term);
      btn.classList.toggle('off', !!(ageOk && !csTermAllowed(t, age)));
    });

    // 保額
    const faceOk = cs.face !== null && cs.face >= p.faceMin && cs.face <= p.faceMax;
    const range = $('cs-range');
    const sliderVal = cs.face === null ? p.faceMin : Math.min(p.faceMax, Math.max(p.faceMin, cs.face));
    range.value = sliderVal;
    range.style.setProperty('--p', cs.face === null ? '0%' : `${(sliderVal - p.faceMin) / (p.faceMax - p.faceMin) * 100}%`);
    $('cs-face-note').textContent = (cs.face !== null && !faceOk) ? `保額範圍：${p.faceMin} ~ ${p.faceMax} 萬` : '';
    $('cs-est-l').textContent = `${cs.freq}保費預估`;

    const checks = [ageOk, !!cs.term, faceOk];
    const termObj = p.terms.find(t => t.term === cs.term);

    if (!checks.every(Boolean)) { csPanelIdle(checks); return; }
    if (!csTermAllowed(termObj, age)) {
      csPanelIdle(checks, `保險年齡 ${age.insuranceAge} 歲（足歲 ${age.actualAge} 歲）不在 ${termObj.term} 年期的投保範圍（${termObj.ageMin}～${termObj.ageMax} 歲），請改選其他年期。`);
      return;
    }

    const payload = {
      name: cs.name || '客戶',
      birth_year: Number(cs.birthY), birth_month: Number(cs.birthM), birth_day: Number(cs.birthD),
      payment_term: cs.term, payment_freq: cs.freq, face_amount_wan: cs.face,
      first_payment_method: cs.firstPay, renewal_payment_method: cs.renewPay, discount: cs.discount,
    };
    const key = p.apiProduct + JSON.stringify(payload);
    if (key === cs.lastKey) return;   // 與上次相同，不重算
    cs.lastKey = key;
    clearTimeout(cs.timer);
    cs.reqSeq++;                      // 讓還在路上的舊結果作廢
    csPanelLoading();
    cs.timer = setTimeout(() => csCalculate(p, payload, key), 600);
  }

  function csPanelIdle(checks, warning) {
    cs.lastKey = null;
    cs.reqSeq++;
    clearTimeout(cs.timer);
    document.getElementById('cs-est').textContent = '—';
    document.getElementById('cs-table-card').style.display = 'none';
    const items = ['填寫出生年月日', '選擇繳費年期', '設定規劃保額'];
    const panel = document.getElementById('cs-panel');
    panel.className = 'cs-panel';
    panel.innerHTML = `
      <div class="cs-icon">${warning ? '⚠️' : '📋'}</div>
      <h3>${warning ? '無法試算' : '即時試算保費'}</h3>
      <div class="hint ${warning ? 'err' : ''}">${warning || '完成左方三項資料<br>結果將自動顯示於此'}</div>
      <div class="cs-check">
        ${items.map((t, i) => `<div class="${checks[i] ? 'done' : ''}"><i>${checks[i] ? '✓' : ''}</i>${t}</div>`).join('')}
      </div>`;
  }

  function csPanelLoading() {
    document.getElementById('cs-est').textContent = '…';
    const panel = document.getElementById('cs-panel');
    panel.className = 'cs-panel';
    panel.innerHTML = `
      <div class="cs-spinner"></div>
      <h3>試算中…</h3>
      <div class="hint">正在用官方 Excel 建議書重新計算<br>閒置後第一次試算可能需要 15～30 秒</div>`;
  }

  async function csCalculate(product, payload, key) {
    const seq = ++cs.reqSeq;
    try {
      const resp = await fetch(`${CANCER_API_BASE}/api/${product.apiProduct}/calculate`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...payload, want_pdf: false }),
      });
      const data = await resp.json();
      if (seq !== cs.reqSeq) return;
      if (!resp.ok) throw new Error(data.error || '試算失敗，請確認輸入內容');
      if (!data.premiums || !(data.premiums.annual_premium_gross > 0)) {
        throw new Error('輸入條件超出本商品承保範圍，請確認年齡、繳費年期與保額');
      }
      cs.lastData = data;
      csPanelResult(product, payload, data);
    } catch (err) {
      if (seq !== cs.reqSeq) return;
      cs.lastKey = null;   // 允許使用者不改資料直接重試
      const msg = err.message === 'Failed to fetch' ? '連不上試算服務，請稍後再試' : err.message;
      document.getElementById('cs-est').textContent = '—';
      const panel = document.getElementById('cs-panel');
      panel.className = 'cs-panel';
      panel.innerHTML = `
        <div class="cs-icon">⚠️</div>
        <h3>試算失敗</h3>
        <div class="hint err">${csEsc(msg)}</div>
        <button class="cs-pdf-btn" style="max-width:240px" onclick="cs.lastKey=null; csRefresh()">重新試算</button>`;
    }
  }

  function csPanelResult(product, payload, data) {
    const pr = data.premiums || {};
    const age = csAge();
    const freq = payload.payment_freq;
    document.getElementById('cs-est').textContent = fmtNum(pr.annual_premium_gross);
    const discounted = pr.first_period_premium < pr.annual_premium_gross;

    const panel = document.getElementById('cs-panel');
    panel.className = 'cs-panel result';
    panel.innerHTML = `
      <div class="cs-res-tag">${product.code}・${payload.payment_term} 年期・${fmtNum(pr.final_face_amount_wan)} 萬</div>
      <div class="cs-res-label">${freq}應繳保費</div>
      <div class="cs-res-big">${fmtNum(pr.annual_premium_gross)}<small>元</small></div>
      <div class="cs-res-rows">
        <div><span>每期實繳保費${discounted ? '（折扣後）' : ''}</span><b>${fmtNum(pr.first_period_premium)} 元</b></div>
        <div><span>首年實繳保費</span><b>${fmtNum(pr.first_year_premium)} 元</b></div>
        <div><span>續年實繳保費</span><b>${fmtNum(pr.renewal_year_premium)} 元</b></div>

        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...payload, want_pdf: true }),

      const data = await resp.json();
      if (!resp.ok || !data.pdf_base64) throw new Error(data.error || 'PDF 產生失敗');

      .map(t => `<option value="${t}">${t} 年</option>`).join('');
    return `
      <div class="form-section">
        <div class="form-section-title">被保險人基本資料</div>
        <div class="form-grid">
          <div class="field">
            <label>姓名</label>
            <input type="text" id="sd-name" value="客戶">
          </div>
          <div class="field">
            <label>性別</label>
            <div class="radio-group" data-target="sd-gender">
              <div class="radio-pill active" data-value="女">女</div>
              <div class="radio-pill" data-value="男">男</div>
            </div>
            <input type="hidden" id="sd-gender" value="女">
          </div>
        </div>
        <div class="field" style="margin-top:14px;">
          <label>生日（民國）</label>
          <div class="birth-row">
            <input type="number" id="sd-birth-year" placeholder="年" min="1" max="200">
            <span>年</span>
            <input type="number" id="sd-birth-month" placeholder="月" min="1" max="12">
            <span>月</span>
            <input type="number" id="sd-birth-day" placeholder="日" min="1" max="31">
            <span>日</span>
          </div>
          <div class="age-hint" id="sd-age-hint" style="display:none;"></div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">保單設定</div>
        <div class="form-grid">
          <div class="field">
            <label>繳費年期</label>
            <select id="sd-payment-term">
              ${termOptions}
            </select>
          </div>
          <div class="field">
            <label>繳別</label>
            <select id="sd-payment-freq">
              <option value="年繳">年繳</option>
              <option value="半年繳">半年繳</option>
              <option value="季繳">季繳</option>
              <option value="月繳">月繳</option>
            </select>
          </div>
        </div>
        <div class="field-note">投保年齡：${product.ageHint || ''}</div>
        <div class="field" style="margin-top:14px;">
          <label>保額（萬元）</label>
          <input type="number" id="sd-face-amount" value="${product.faceAmountDefault ?? 10}" min="${product.faceAmountMin ?? 10}" step="${product.faceAmountStep ?? 1}">
        </div>
        <div class="field-note">${product.faceRangeHint || '保額範圍：10 ~ 500 萬（實際上限依投保年齡可能調整）'}</div>
      </div>

      <details class="advanced">
        <summary>進階選項（繳費方式／保費折扣）</summary>
        <div class="form-grid">
          <div class="field">
            <label>首期繳費方式</label>
            <select id="sd-first-payment-method">
              <option value="金融機構轉帳">金融機構轉帳</option>
              <option value="一般信用卡">一般信用卡</option>
              <option value="富邦信用卡">富邦信用卡</option>
              <option value="匯款">匯款</option>
            </select>
          </div>
          <div class="field">
            <label>續期繳費方式</label>
            <select id="sd-renewal-payment-method">
              <option value="金融機構轉帳">金融機構轉帳</option>
              <option value="一般信用卡">一般信用卡</option>
              <option value="富邦信用卡">富邦信用卡</option>
              <option value="自行繳費">自行繳費</option>
            </select>
          </div>
          <div class="field">
            <label>專案保費折扣</label>
            <select id="sd-discount">
              <option value="無">無</option>
              <option value="員工轉帳件">員工轉帳件</option>
            </select>
          </div>
        </div>
      </details>

      <button class="submit-btn" id="sd-submit-btn">開始試算</button>
      <div class="calc-error" id="sd-error"></div>
      <div class="calc-loading" id="sd-loading">試算中，正在重新計算官方 Excel 建議書，請稍候...</div>

      <div class="result-box" id="sd-result-box">
        <div class="summary-grid" id="sd-summary-grid"></div>
        <div class="table-wrap"><table class="result-table" id="sd-result-table"></table></div>
        <button class="download-pdf-btn" id="sd-download-btn" style="display:none;">📄 下載 PDF 建議書</button>
      </div>
    `;
  }

  function initSDAgeHint() {
    const yearEl = document.getElementById('sd-birth-year');
    const monthEl = document.getElementById('sd-birth-month');
    const dayEl = document.getElementById('sd-birth-day');
    const hintEl = document.getElementById('sd-age-hint');
    if (!yearEl || !monthEl || !dayEl || !hintEl) return;

    function update() {
      const y = yearEl.value, m = monthEl.value, d = dayEl.value;
      if (!y || !m || !d) {
        hintEl.style.display = 'none';
        return;
      }
      const result = calcInsuranceAndActualAge(y, m, d, new Date());
      if (!result) {
        hintEl.style.display = 'none';
        return;
      }
      hintEl.textContent = `保險年齡 ${result.insuranceAge} 歲　實際年齡 ${result.actualAge} 歲`;
      hintEl.style.display = 'block';
    }

    [yearEl, monthEl, dayEl].forEach(el => el.addEventListener('input', update));
  }

  const SD_TABLE_COLUMNS_BASE = [
    { key: 'policy_year', label: '保單年度' },
    { key: 'age', label: '保險年齡' },
    { key: 'annual_premium', label: '年度保費' },
    { key: 'cum_premium', label: '累計保費' },
    { key: 'death_benefit', label: '身故/完全失能保障' },
    { key: 'critical_illness_mental', label: '重大傷病保險金-慢性精神病' },
    { key: 'critical_illness_other', label: '重大傷病保險金-除慢性精神病以外' },
    { key: 'specific_critical_illness', label: '特定重大傷病保險金' },
    { key: 'specific_disease_benefit', label: '特定重大疾病/傷病保險金' },
  ];
  const SD_TABLE_COLUMN_MATURITY = { key: 'maturity_benefit', label: '滿期保險金' };
  const SD_TABLE_COLUMNS_TAIL = [
    { key: 'cash_value', label: '年度末解約金' },
    { key: 'reduced_paid_up', label: '減額繳清保額' },
  ];

  function getSDTableColumns(product) {
    return product.hasMaturityBenefit
      ? [...SD_TABLE_COLUMNS_BASE, SD_TABLE_COLUMN_MATURITY, ...SD_TABLE_COLUMNS_TAIL]
      : [...SD_TABLE_COLUMNS_BASE, ...SD_TABLE_COLUMNS_TAIL];
  }

  async function submitSDCalc(product) {
    const errorEl = document.getElementById('sd-error');
    const loadingEl = document.getElementById('sd-loading');
    const resultBox = document.getElementById('sd-result-box');
    const btn = document.getElementById('sd-submit-btn');
    errorEl.style.display = 'none';
    resultBox.style.display = 'none';

    const birthYear = document.getElementById('sd-birth-year').value;
    const birthMonth = document.getElementById('sd-birth-month').value;
    const birthDay = document.getElementById('sd-birth-day').value;
    if (!birthYear || !birthMonth || !birthDay) {
      errorEl.textContent = '請填寫完整的生日（民國年／月／日）';
      errorEl.style.display = 'block';
      return;
    }

    const payload = {
      name: document.getElementById('sd-name').value || '客戶',
      gender: document.getElementById('sd-gender').value,
      birth_year: Number(birthYear),
      birth_month: Number(birthMonth),
      birth_day: Number(birthDay),
      payment_term: Number(document.getElementById('sd-payment-term').value),
      payment_freq: document.getElementById('sd-payment-freq').value,
      face_amount_wan: Number(document.getElementById('sd-face-amount').value),
      first_payment_method: document.getElementById('sd-first-payment-method').value,
      renewal_payment_method: document.getElementById('sd-renewal-payment-method').value,
      discount: document.getElementById('sd-discount').value,
      want_pdf: true,
    };

    btn.disabled = true;
    loadingEl.style.display = 'block';

    try {
      const resp = await fetch(`${SD_API_BASE}/api/${product.apiProduct}/calculate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      if (!resp.ok) {
        throw new Error(data.error || '試算失敗，請確認輸入內容');
      }
      renderSDResults(data, product);
    } catch (err) {
      errorEl.textContent = '試算失敗：' + err.message + '（若持續發生，可能是後端服務剛啟動需要暖機，請稍後再試一次）';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      loadingEl.style.display = 'none';
    }
  }

  function renderSDResults(data, product) {
    const summaryEl = document.getElementById('sd-summary-grid');
    const p = data.premiums || {};
    summaryEl.innerHTML = `
      <div class="summary-tile"><div class="label">保額（萬元）</div><div class="value">${fmtNum(p.final_face_amount_wan)}</div></div>
      <div class="summary-tile"><div class="label">年繳保費</div><div class="value">${fmtNum(p.annual_premium_gross)}</div></div>
      <div class="summary-tile"><div class="label">首年實繳保費</div><div class="value">${fmtNum(p.first_year_premium)}</div></div>
      <div class="summary-tile"><div class="label">續年實繳保費</div><div class="value">${fmtNum(p.renewal_year_premium)}</div></div>
    `;

    const columns = getSDTableColumns(product);
    const tableEl = document.getElementById('sd-result-table');
    const rows = (data.tables && data.tables.main && data.tables.main.rows) || [];
    const head = '<tr>' + columns.map(c => `<th>${c.label}</th>`).join('') + '</tr>';
    const body = rows.map(row =>
      '<tr>' + columns.map(c => `<td>${c.key === 'policy_year' || c.key === 'age' ? (row[c.key] === null || row[c.key] === undefined ? '—' : Math.round(row[c.key])) : fmtNum(row[c.key])}</td>`).join('') + '</tr>'
    ).join('');
    tableEl.innerHTML = head + body;

    const downloadBtn = document.getElementById('sd-download-btn');
    if (data.pdf_base64) {
      downloadBtn.style.display = 'block';
      downloadBtn.onclick = () => downloadPdfBlob(data.pdf_base64, '建議書.pdf');
    } else {
      downloadBtn.style.display = 'none';
    }

    document.getElementById('sd-result-box').style.display = 'block';
  }

  // ---------- 建立首頁模組卡片 ----------
  const gridEl = document.getElementById('module-grid');
  gridEl.innerHTML = MODULES.map((mod, i) => `
    <div class="module-card" onclick="showModule(${i})">
      <div class="module-icon">${mod.icon}</div>
      <div class="module-info">
        <div class="module-name">${mod.name}</div>
        <div class="module-count">${mod.products.length} 項商品</div>
      </div>
      <div class="module-arrow">›</div>
    </div>
  `).join('');
</script>

</body>
</html>
